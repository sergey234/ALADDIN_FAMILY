# Knowledge Pack — столп «Маленькие шаги» (behavioral)
pack_version: behavioral_v1.0
pillar: behavioral
schema: wellness_knowledge_pack_v1
status: draft

ui:
  ru: Маленькие шаги
  en: Small steps

allowed_topics:
  - micro_habits
  - if_then
  - energy
  - one_action_today

forbidden_concepts:
  - diagnosis
  - other_pillars
  - therapy_claims
  - reflex_conditioning
  - jung_dreams

forbidden_phrases:
  ru:
    - рефлекс
    - дрессиров
    - Павлов
    - диагноз
    - терапия
  en:
    - Pavlov
    - conditioning
    - diagnose
    - therapy

llm_rules:
  ru: >
    Один конкретный шаг на сегодня. Без морали и без «надо всё изменить».
    Если устал — шаг на 2 минуты. Не смешивай разбор мыслей или дыхание.
  en: >
    One concrete step for today. No guilt. If tired — a 2-minute step.
    Do not mix thought work or breathing here.

exercises:
  micro_habit:
    id: micro_habit
    total_steps: 3
    steps:
      - step: 1
        hint:
          ru: "Что одно маленькое действие сегодня реально сделать за 2 минуты?"
          en: "What is one tiny action you can really do in 2 minutes today?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 1; один микро-шаг; без списка дел."
          en: "Voice only step 1; one micro-step; no to-do lists."
      - step: 2
        hint:
          ru: "Когда именно сделаешь — время или ситуация (после завтрака, перед сном)?"
          en: "When will you do it — a time or situation (after breakfast, before bed)?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 2; время или ситуация; один вопрос."
          en: "Voice only step 2; time or situation; one question."
      - step: 3
        hint:
          ru: "Как поймёшь, что шаг сделан? Одно слово."
          en: "How will you know the step is done? One word?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 3; как отметить успех; коротко."
          en: "Voice only step 3; how to mark success; keep it short."

  if_then_plan:
    id: if_then_plan
    total_steps: 3
    steps:
      - step: 1
        hint:
          ru: "Если случится X (триггер), я сделаю Y — запиши X одной фразой."
          en: "If X happens (trigger), I will do Y — write X in one phrase."
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 1; триггер X одной фразой."
          en: "Voice only step 1; trigger X in one phrase."
      - step: 2
        hint:
          ru: "Теперь Y — самый маленький ответ на X."
          en: "Now Y — the smallest response to X."
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 2; самый маленький Y."
          en: "Voice only step 2; smallest Y."
      - step: 3
        hint:
          ru: "Где напоминание поможет — телефон, стикер, друг?"
          en: "Where would a reminder help — phone, sticker, friend?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 3; одно место для напоминания."
          en: "Voice only step 3; one reminder place."

hero_flavor:
  unicorn:
    ru: "Один маленький шаг — уже победа. Без списка дел на неделю."
    en: "One tiny step is already a win. No week-long to-do lists."
    flavor_key: step_friend
  aladdin:
    ru: "План только на сегодня: один шаг, одно «если — то». Без «ты должен»."
    en: "Plan for today only: one step, one if-then. No «you must»."
    flavor_key: plan_today
  genie:
    ru: "Маленькое — но своё. Лёгкая шутка только если не грусть (L0); при грусти или кризисе — без шуток."
    en: "Small — but yours. Light humor only when not sad (L0); no jokes when sad or in crisis."
    flavor_key: step_playful_l0
