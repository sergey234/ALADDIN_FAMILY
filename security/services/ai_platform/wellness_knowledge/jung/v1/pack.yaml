# Knowledge Pack — столп «Понять себя» (Jung lite; gate p0-08)
pack_version: jung_v1.0
pillar: jung
schema: wellness_knowledge_pack_v1
status: draft

ui:
  ru: Понять себя
  en: Understand yourself

allowed_topics:
  - dreams_as_metaphor
  - symbols_lite
  - reflection_without_prediction

forbidden_concepts:
  - diagnosis
  - fortune_telling
  - other_pillars
  - therapy_claims

forbidden_phrases:
  ru:
    - предсказ
    - сбудется
    - диагноз
    - терапия
    - Юнг
    - Фрейд
  en:
    - will happen
    - predict your future
    - diagnose
    - Jung
    - Freud

llm_rules:
  ru: >
    Сны и образы — метафоры, не предсказания. Один вопрос за раз.
    Не давай медицинских или мистических выводов. При кризисе — взрослый или 112.
  en: >
    Dreams and images are metaphors, not predictions. One question at a time.
    No medical or mystical conclusions. In crisis — trusted adult or emergency.

exercises:
  dream_note_lite:
    id: dream_note_lite
    total_steps: 3
    steps:
      - step: 1
        hint:
          ru: "Коротко: что запомнилось из сна или образа? Без оценки."
          en: "Briefly: what do you remember from a dream or image? No judgment."
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 1; без интерпретации и без предсказаний."
          en: "Voice only step 1; no interpretation or predictions."
      - step: 2
        hint:
          ru: "Какое одно чувство было сильнее всего?"
          en: "What one feeling was strongest?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 2; одно чувство."
          en: "Voice only step 2; one feeling."
      - step: 3
        hint:
          ru: "Если бы это был символ — что он мог бы означать для тебя сейчас?"
          en: "If it were a symbol — what might it mean for you right now?"
        llm_rephrase_only: true
        instruction:
          ru: "Озвучь только шаг 3; смысл для тебя сейчас; не «сбудется»."
          en: "Voice only step 3; meaning for you now; not «it will happen»."

hero_flavor:
  unicorn:
    ru: "Образы без страха — как подсказки, не приговор и не предсказание."
    en: "Gentle images — hints, not verdicts or fortune-telling."
    flavor_key: image_safe
  aladdin:
    ru: "Спокойный смысл: один образ и один мягкий вопрос, без мистики."
    en: "Calm meaning: one image and one gentle question, no mysticism."
    flavor_key: image_mentor
  genie:
    ru: "Сказочный образ без «исполню желание» и без предсказаний будущего."
    en: "Fairy-tale image without wish-granting or predicting the future."
    flavor_key: image_fable
