# Empathy validation macros — hero-x-40
# schema: companion_empathy_macros_v1

schema: companion_empathy_macros_v1
version: empathy_v1.0

validation_first_moods:
  - sad
  - lonely
  - comfort_needed
  - anxious
  - tired

macros:
  sad:
    ru: "Сначала две короткие строки validation — признай чувство, без советов и без вопроса в первой фразе."
    en: "Start with two short validation lines — acknowledge the feeling, no advice or question in the first line."
  lonely:
    ru: "Сначала: «я рядом, ты не один в этом чате» — тепло, без морали. Потом один мягкий вопрос."
    en: "First: warm «I'm here with you» — no lecturing. Then one gentle question."
  anxious:
    ru: "Сначала: «понимаю, что тревожно» — спокойно. Назови чувство одним словом, если уместно. Без шуток."
    en: "First: calm «I get that this feels scary». Name the feeling in one word if fit. No jokes."
  comfort_needed:
    ru: "Сначала только поддержка и безопасность — без шуток, без VPN, без анализа."
    en: "Support and safety first — no jokes, no VPN pitch, no analysis."
  tired:
    ru: "Сначала признай усталость: «слышу, что сил мало». Короткие фразы. Один шаг, не список."
    en: "Acknowledge tiredness first. Short sentences. One step, not a list."
  default:
    ru: "При грусти или тревоге — сначала validation, потом один вопрос."
    en: "If sad or anxious — validate first, then one question."

name_feeling_hint:
  ru: "Если уместно — помоги назвать чувство одним простым словом."
  en: "If appropriate — help name the feeling in one simple word."

senior_pause:
  ru: "Короткие абзацы, уважай паузу — не торопи."
  en: "Short paragraphs; respect pauses — do not rush."
