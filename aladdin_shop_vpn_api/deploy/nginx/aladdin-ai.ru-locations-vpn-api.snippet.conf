# Фрагмент для server { … } на aladdin-ai.ru (HTTPS).
# Вставить ПЕРЕД блоком «Telegram Shop Partner API» location /v1/ — иначе Partner перехватит /v1/*.
#
#   location ^~ /v1/legal/  → 8091  (длиннее префикса, чем location /v1/ у Partner)
#   location ^~ /sub/       → 8091

    # aladdin-shop-vpn-api (127.0.0.1:8091) — только публичные пути (vpn-03).
    # ВАЖНО: не использовать общий префикс /v1/legal/ — ломает Partner /v1/legal/privacy|terms (:8090).
    location ^~ /v1/legal/vpn- {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /sub/ {
        access_log off;
        limit_req zone=vpn_sub_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
