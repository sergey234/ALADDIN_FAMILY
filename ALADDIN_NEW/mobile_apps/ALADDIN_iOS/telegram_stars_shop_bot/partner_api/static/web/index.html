<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Aladdin-like storm navy + gold (visual only) */
      --bg-dark: #0f1b2b;
      --bg-gradient-start: #07112a;
      --bg-storm-mid: #0a1833;
      --bg-gradient-end: #112345;
      --card: rgba(28, 44, 77, 0.82);
      --text: #f5f7fa;
      --muted: rgba(245, 247, 250, 0.72);
      --accent: #f5c86e;
      --accent-blue: #4c6fff;
      --gold: #f5c86e;
      --gold-dark: #e8b650;
      --gold-light: #ffe08a;
      --gold-text: #1a1208;
      --ok: #22c55e;
      --warn: #fbbf24;
      --bad: #ef4444;
      --border: rgba(255, 255, 255, 0.12);
      --border-gold: rgba(245, 200, 110, 0.35);
      --font-display: "Fraunces", "Times New Roman", serif;
      --font-body: "Outfit", system-ui, sans-serif;
      --shadow-gold: 0 8px 28px rgba(245, 200, 110, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-gradient-start), var(--bg-storm-mid) 48%, var(--bg-gradient-end));
      background-attachment: fixed;
      position: relative;
    }
    /* Aladdin-style storm video atmosphere (same assets as aladdin-ai.ru) */
    .storm-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .storm-atmosphere video,
    .storm-atmosphere img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .storm-atmosphere .storm-poster {
      z-index: 0;
      opacity: 1;
    }
    .storm-atmosphere .storm-video {
      z-index: 1;
      opacity: 0.95;
      filter: contrast(1.12) brightness(1.06) saturate(1.08);
    }
    .storm-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(7, 17, 42, 0.55) 0%, rgba(15, 27, 43, 0.28) 45%, rgba(17, 35, 69, 0.42) 100%),
        radial-gradient(ellipse at 72% 18%, rgba(245, 200, 110, 0.18), transparent 50%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px calc(48px + env(safe-area-inset-bottom, 0px));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin: 0 -16px 4px;
      padding: calc(6px + env(safe-area-inset-top)) 12px 0;
    }
    .lang-switch {
      display: inline-flex;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      background: rgba(7, 17, 42, 0.75);
    }
    .lang-switch__btn {
      border: 0;
      min-width: 40px;
      min-height: 32px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .lang-switch__btn--active {
      background: linear-gradient(135deg, #ffe08a 0%, var(--gold) 50%, var(--gold-dark) 100%);
      color: var(--gold-text);
      box-shadow: var(--shadow-gold);
    }
    h1, .brand-gold {
      font-family: var(--font-display);
      font-size: 1.65rem;
      margin: 0 0 6px;
      font-weight: 700;
      letter-spacing: 0.01em;
      background: linear-gradient(135deg, #fff0b0 0%, var(--gold-light) 35%, var(--gold) 70%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(245, 200, 110, 0.25));
    }
    .muted { color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
      backdrop-filter: blur(8px);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .btn {
      display: block; width: 100%; text-align: center; border: 0; border-radius: 999px;
      padding: 14px 16px; font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: var(--font-body);
      background: linear-gradient(135deg, #ffe08a 0%, var(--gold) 45%, var(--gold-dark) 100%);
      color: var(--gold-text);
      text-decoration: none; margin-top: 10px;
      box-shadow: var(--shadow-gold);
      transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
      min-height: 48px;
    }
    .btn:hover { filter: brightness(1.06); box-shadow: 0 10px 32px rgba(245, 200, 110, 0.38); }
    .btn:active { transform: translateY(1px); }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      box-shadow: none;
    }
    .btn.secondary:hover { background: rgba(245, 200, 110, 0.08); filter: none; }
    .btn.danger { background: transparent; border: 1px solid var(--bad); color: #fecaca; box-shadow: none; }
    .btn.inline { display: inline-block; width: auto; padding: 10px 14px; margin: 6px 6px 0 0; font-size: 0.9rem; border-radius: 999px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; box-shadow: none; }
    .btn:focus-visible,
    .nav button:focus-visible,
    .lang-switch__btn:focus-visible,
    .tariff:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    .tariff {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border: 1px solid var(--border); border-radius: 14px; margin: 8px 0;
      cursor: pointer; transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .tariff.selected {
      border-color: var(--gold);
      background: rgba(245, 200, 110, 0.08);
      box-shadow: 0 0 0 1px rgba(245, 200, 110, 0.25), var(--shadow-gold);
    }
    .nav {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7, 11, 20, 0.94); backdrop-filter: blur(10px);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      display: flex; justify-content: space-around;
      padding: 8px 4px;
      margin: 0 0 14px; flex-wrap: wrap; gap: 4px;
    }
    .nav button {
      background: none; border: 0; color: var(--muted); font-size: 0.78rem; cursor: pointer;
      padding: 10px 8px; flex: 1; min-width: 64px; min-height: 44px;
      border-radius: 999px; font-family: var(--font-body); font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .nav button.active {
      color: var(--gold-text);
      font-weight: 700;
      background: linear-gradient(135deg, #ffe08a 0%, var(--gold) 50%, var(--gold-dark) 100%);
      box-shadow: var(--shadow-gold);
    }
    input[type="text"], input:not([type]) { font-size: 16px; }
    .view { animation: aimFade 0.28s ease; }
    @keyframes aimFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .view { animation: none; }
      .btn, .tariff, .nav button { transition: none; }
      .storm-atmosphere video { display: none !important; }
    }
    .view h2, .card > strong:first-child { font-size: 1.15rem; display: block; margin-bottom: 6px; }
    .label-tag {
      display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em;
      text-transform: uppercase; color: var(--gold); margin: 0 0 6px;
    }
    .label-tag.warn { color: var(--warn); }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .ok { color: var(--ok); }
    label.check { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; font-size: 0.9rem; color: var(--muted); }
    .qr-host img { max-width: 220px; display: block; margin: 12px auto; background: #fff; padding: 8px; border-radius: 8px; }
    .steps { padding-left: 1.1rem; margin: 8px 0; color: var(--muted); }
    .steps li { margin: 6px 0; }
    .hidden { display: none !important; }
    .progress-wrap { margin: 10px 0 4px; }
    .progress-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .progress-bar {
      height: 10px; border-radius: 999px; background: #1a2740; overflow: hidden; margin-top: 8px;
    }
    .progress-bar > span { display: block; height: 100%; border-radius: 999px; }
    .progress-bar.ok > span { background: var(--ok); }
    .progress-bar.warn > span { background: var(--warn); }
    .progress-bar.bad > span { background: var(--bad); }
    .device-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
    @media (min-width: 560px) { .device-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 860px) {
      .wrap { max-width: 960px; }
      .device-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
    .device-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
    }
    .device-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .device-card .status { font-size: 0.9rem; margin: 4px 0 8px; }
    .device-card details { margin-top: 8px; }
    .device-card summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
    .device-card input.rename {
      width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: #0f1828; color: var(--text); font-size: 1rem;
    }
    .modal-back {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border-gold); border-radius: 16px;
      padding: 18px; max-width: 420px; width: 100%;
    }
    .site-footer {
      margin-top: 28px;
      padding: 20px 4px 8px;
      border-top: 1px solid var(--border-gold);
    }
    .site-footer h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      margin: 0 0 12px;
      color: var(--gold-light);
    }
    .site-footer__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .site-footer a { color: var(--gold-light); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    .site-footer__legal { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
    .site-footer__copy { margin-top: 14px; text-align: center; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>

    const LANG_KEY = "aim_lang";
    function detectLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "ru" || saved === "en") return saved;
      const browser = (navigator.language || "ru").toLowerCase();
      return browser.startsWith("en") ? "en" : "ru";
    }
    let aimLang = detectLang();
    function t(key, vars) {
      const dict = (AIM_I18N[aimLang] || AIM_I18N.ru);
      let s = (dict[key] !== undefined ? dict[key] : (AIM_I18N.ru[key] || key));
      if (vars && typeof vars === "object") {
        Object.keys(vars).forEach(k => { s = s.replace(new RegExp("\\{" + k + "\\}", "g"), String(vars[k])); });
      }
      return s;
    }
    function applyStaticI18n() {
      document.documentElement.lang = aimLang;
      document.title = t("page.title");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });
      document.querySelectorAll("#langSwitch .lang-switch__btn").forEach(btn => {
        const on = btn.getAttribute("data-lang") === aimLang;
        btn.classList.toggle("lang-switch__btn--active", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
      const b = document.getElementById("brand");
      if (b && !/@/.test(b.textContent || "")) {
        b.textContent = t("brand");
        b.classList.add("brand-gold");
      }
    }
    function setLang(lang) {
      if (lang !== "ru" && lang !== "en") return;
      aimLang = lang;
      localStorage.setItem(LANG_KEY, lang);
      applyStaticI18n();
      if (typeof renderAll === "function") renderAll();
    }



    const API = "/v1";
    const state = {
      products: [],
      selected: null,
      accountId: localStorage.getItem("aim_account") || "",
      sessionSecret: localStorage.getItem("aim_session") || "",
      me: null,
      devices: null,
      orderToken: null,
      legal: false,
      nickname: localStorage.getItem("aim_nickname") || "",
      ref: localStorage.getItem("aim_ref") || "",
      supportUrl: "https://t.me/AiMonkeyStars_bot",
      tab: "home",
      _orderPollTimer: null,
    };

    function $(id) { return document.getElementById(id); }

    function saveSession(accountId, secret) {
      state.accountId = accountId;
      state.sessionSecret = secret;
      localStorage.setItem("aim_account", accountId);
      localStorage.setItem("aim_session", secret);
      document.cookie = `aim_account=${encodeURIComponent(accountId)}; path=/; max-age=31536000; SameSite=Lax`;
      document.cookie = `aim_session=${encodeURIComponent(secret)}; path=/; max-age=31536000; SameSite=Lax`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error((data && data.detail && (data.detail.message || data.detail.code)) || ("HTTP " + res.status));
        err.data = data;
        throw err;
      }
      return data;
    }

    function daysLeft(iso) {
      if (!iso) return null;
      const t = Date.parse(iso);
      if (!t) return null;
      return Math.max(0, Math.ceil((t - Date.now()) / 86400000));
    }

    function orderPageUrl(token) {
      const t = token || state.orderToken || localStorage.getItem("aim_last_order") || "";
      if (!t) return "";
      return location.origin + "/o/" + encodeURIComponent(t);
    }

    function supportBtn(extraClass) {
      const u = state.supportUrl || "https://t.me/AiMonkeyStars_bot";
      return `<a class="btn ${extraClass || "secondary"}" href="${u}" target="_blank" rel="noopener">${t("btn.support")}</a>`;
    }

    function drawQr(container, text, alt) {
      if (!container || !text) return;
      container.innerHTML = "";
      container.classList.add("qr-host");
      const img = document.createElement("img");
      img.alt = alt || "QR";
      img.width = 220;
      img.height = 220;
      img.src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(text);
      container.appendChild(img);
    }

    function happAddDeeplink(url) {
      const u = String(url || "").trim();
      if (!u) return "";
      return "happ://add/" + u;
    }

    function happLinkHtml(url, qrId) {
      const safe = String(url || "").replace(/'/g, "\\'");
      const deeplink = happAddDeeplink(url);
      const deepSafe = String(deeplink || "").replace(/'/g, "\\'");
      const ios = "https://apps.apple.com/us/app/happ-proxy-utility/id6783623643";
      const and = "https://play.google.com/store/apps/details?id=com.happproxy";

        <p class="ok"><strong>${t("happ.ready")}</strong></p>

          <li><b>${t("happ.step2")}</b></li>
          <li><b>${t("happ.step3")}</b></li>
          <li><b>${t("happ.step4")}</b></li>
        </ol>
        <p class="muted">${t("happ.personal")}</p>
        <p class="mono">${url}</p>
        <button class="btn" type="button" onclick="navigator.clipboard.writeText('${safe}')">${t("happ.copy")}</button>
        ${deeplink ? `<a class="btn" href="${deepSafe}">${t("happ.open")}</a>` : ""}
        <a class="btn secondary" href="${ios}" target="_blank" rel="noopener">${t("happ.appstore")}</a>
        <a class="btn secondary" href="${and}" target="_blank" rel="noopener">${t("happ.play")}</a>
        <div id="${qrId}" class="qr-host"></div>
        <details class="card" style="margin-top:12px;padding:12px">
          <summary style="cursor:pointer;font-weight:700">${t("happ.geo_title")}</summary>
          <ol class="steps" style="font-size:1.02rem;line-height:1.55;margin-top:10px">
            <li>${t("happ.geo1")}</li>
            <li>${t("happ.geo2")}</li>
            <li>${t("happ.geo3")}</li>
            <li>${t("happ.geo4")}</li>
            <li>${t("happ.geo5")}</li>
            <li>${t("happ.geo6")}</li>
          </ol>
          <p class="muted">${t("happ.geo_android")}</p>
        </details>`;
    }

    function showTab(name, opts) {
      const syncUrl = !opts || opts.syncUrl !== false;
      state.tab = name;
      document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
      const el = $("view-" + name);
      if (el) el.classList.remove("hidden");
      document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === name);
      });
      if ($("mainNav") && name !== "order") $("mainNav").classList.remove("hidden");
      if (syncUrl) syncTabUrl(name);
    }

    function syncTabUrl(name) {
      try {
        const path = location.pathname || "/";
        const search = location.search || "";
        // Deep link заказа: уход с вкладки order меняет URL на обычные вкладки.
        if (/^\/o\//.test(path) || /^\/web\/o\//.test(path)) {
          if (name === "order") {
            if (location.hash) history.replaceState(null, "", path + search);
            return;
          }
          if (name === "devices") {
            history.replaceState(null, "", "/devices");
            return;
          }
          if (name === "home") {
            history.replaceState(null, "", "/" + search);
            return;
          }
          history.replaceState(null, "", "/" + search + "#" + name);
          return;
        }
        if (name === "devices") {
          if (!/\/devices\/?$/.test(path) || location.hash) {
            history.replaceState(null, "", "/devices");
          }
          return;
        }
        if (name === "home") {
          history.replaceState(null, "", "/" + search);
          return;
        }
        if (name === "order") return;
        history.replaceState(null, "", "/" + search + "#" + name);
      } catch (_) {}
    }

    function deviceIcon(kind) {
      const k = (kind || "unknown").toLowerCase();
      if (k === "iphone" || k === "android") return "📱";
      if (k === "tablet") return "📲";
      if (k === "laptop") return "💻";
      if (k === "desktop") return "🖥️";
      return "📟";
    }

    function deviceStatusLabel(d) {
      const st = (d && d.status) || "awaiting";
      if (st === "online") return "🟢 В сети сейчас";
      if (st === "offline") {
        const ls = d.last_seen_at ? (" · был в сети: " + d.last_seen_at) : "";
        return "🟡 Был в сети" + ls;
      }
      return "⚪️ Ожидает подключения";
    }

    function humanConnectedDate(iso) {
      if (!iso) return "";
      try {
        const dt = new Date(iso);
        if (Number.isNaN(dt.getTime())) return "";
        return "Подключен " + dt.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
      } catch (_) { return ""; }
    }

    function progressTone(used, max) {
      const u = Number(used) || 0;
      const m = Math.max(1, Number(max) || 1);
      if (u >= m) return "bad";
      if (m - u === 1) return "warn";
      if ((m - u) / m > 0.2) return "ok";
      return "warn";
    }

    function authBody() {
      return {
        account_id: state.accountId,
        session_secret: state.sessionSecret,
      };
    }

    async function refreshDevices() {
      if (!state.accountId || !state.sessionSecret) {
        state.devices = null;
        return;
      }
      try {
        state.devices = await api(
          `/web/devices?account_id=${encodeURIComponent(state.accountId)}&session_secret=${encodeURIComponent(state.sessionSecret)}`
        );
      } catch (_) {
        state.devices = null;
      }
    }

        return;

      const used = pack.used || 0;
      const max = pack.max || 1;
      const tone = progressTone(used, max);
      const pct = Math.min(100, Math.round(100 * used / Math.max(1, max)));
      const devices = pack.devices || [];
      const cards = devices.map(d => {
        const id = d.id;
        const name = (d.display_name || "Устройство").replace(/</g, "&lt;");
        const url = d.subscription_url || "";

          </article>`;
      }).join("");
      const addLabel = pack.can_add
        ? t("devices.add")
        : t("devices.full");
      $("view-devices").innerHTML = `
        <div class="card">
          <strong>${t("devices.title")}</strong>
          <div class="progress-wrap">
            <div class="progress-meta">
              <span>${t("devices.used")} <b>${used} ${t("devices.of")} ${max}</b></span>
              <span class="muted">${tone === "bad" ? t("devices.limit") : t("devices.can_add")}</span>
            </div>

          </div>
          <button class="btn" type="button" id="addDeviceBtn" ${pack.can_add ? "" : "disabled"}
            onclick="addDevice()">${addLabel}</button>
          ${!pack.can_add ? `<p class="muted">${t("devices.one_hint_full")}</p>` : `<p class="muted">${t("devices.one_hint")}</p>`}

          <p class="muted">${t("devices.footnote")}</p>
          ${supportBtn("secondary")}

    function orderStatusRu(st) {
      const s = String(st || "").toLowerCase();
      if (s === "completed") return t("order.completed");
      if (s === "paid" || s === "processing") return t("order.processing");
      if (s === "pending_payment") return t("order.pending");
      if (s === "expired") return t("order.expired");
      if (s === "refunded") return t("order.refunded");
      return st || t("order.unknown");
    }

    function historyOrdersForDisplay(orders) {
      const list = Array.isArray(orders) ? orders.slice() : [];
      const paid = list.filter(o => {
        const s = String(o.status || "").toLowerCase();
        return s === "completed" || s === "paid" || s === "processing";
      });
      const pending = list.filter(o => String(o.status || "").toLowerCase() === "pending_payment");
      // Один свежий неоплаченный счёт + успешные оплаты. expired не показываем.
      const out = [];
      if (pending.length) out.push(pending[0]);
      out.push(...paid);
      return out.slice(0, 12);
    }

            session_secret: state.sessionSecret,

        renderProfile();

        } else if (box && payUrl) {
          drawQr(box, payUrl, "QR страницы оплаты");
        }
        if (state._orderPollTimer) clearTimeout(state._orderPollTimer);
        state._orderPollTimer = setTimeout(function() {
          const stillOrder =
            state.tab === "order" ||
            /^\/o\//.test(location.pathname || "") ||
            /^\/web\/o\//.test(location.pathname || "");
          if (stillOrder) pollOrder();
        }, preparing ? 3000 : 4000);
      }
    }

    window.selectTariff = function(id) {
      state.selected = id;
      renderSubs();
    };

    window.startCheckout = async function() {
      $("payErr").textContent = "";
      if (!state.selected) { $("payErr").textContent = "Выберите тариф"; return; }
      if (!state.legal) { $("payErr").textContent = "Нужно согласие с документами"; return; }
      const nickBox = $("nickBox");
      const nick = ((nickBox && nickBox.value) || state.nickname || (state.me && state.me.nickname) || "").trim();
      if (!(state.me && state.me.nickname) && nick.length < 3) {
        $("payErr").textContent = "Укажите ник (латиница, от 3 символов)";
        return;
      }
      try {
        const body = {
          product_id: state.selected,
          legal_accepted: true,
          ref_code: state.ref || null,
          account_id: state.accountId || null,
          session_secret: state.sessionSecret || null,
          nickname: nick || null,
        };
        const data = await api("/web/checkout", { method: "POST", body: JSON.stringify(body) });
        saveSession(data.account_id, data.session_secret);
        if (data.nickname) {
          state.nickname = data.nickname;
          localStorage.setItem("aim_nickname", data.nickname);
        }
        state.orderToken = data.access_token;
        localStorage.setItem("aim_last_order", data.access_token);
        if (data.pay_url) localStorage.setItem("aim_last_pay", data.pay_url);
        if (data.qr_url) localStorage.setItem("aim_last_pay_qr", data.qr_url);
        else localStorage.removeItem("aim_last_pay_qr");
        if (data.access_code) {
          showAccessCodeModal(data.access_code, data.nickname || nick, function() {
            location.href = "/o/" + encodeURIComponent(data.access_token);
          });
          return;
        }
        location.href = "/o/" + encodeURIComponent(data.access_token);
      } catch (e) {
        const detail = (e && e.data && e.data.detail) || {};
        const code = detail.code || "";
        const msgMap = {
          nickname_required: "Укажите ник перед оплатой",
          nickname_taken: "Этот ник уже занят — выберите другой",
          bad_chars: "Ник: латиница, цифры, _ ; с буквы; 3–24 символа",
          looks_like_email: "Ник не должен быть как email",
          looks_like_phone: "Ник не должен быть как телефон",
          too_short: "Ник слишком короткий",
          too_long: "Ник слишком длинный",
        };
        $("payErr").textContent = msgMap[code] || detail.message || code || (e && e.message) || "Ошибка оплаты";
      }
    };

    function showAccessCodeModal(code, nick, onOk) {
      const host = $("modalHost");
      if (!host) { if (onOk) onOk(); return; }
      host.innerHTML = `<div class="modal-back"><div class="modal">
        <strong>Ваш код доступа</strong>
        <p class="muted">Ник: <b>@${nick || ""}</b></p>
        <p class="mono" style="font-size:1.2rem;margin:12px 0">${code}</p>
        <p class="muted">Сохраните. По нему войдёте с другого телефона. Мы <b>не</b> отправим код на почту — почту не просим.</p>
        <button class="btn" type="button" id="copyAccessCode">Скопировать код</button>
        <button class="btn secondary" type="button" id="okAccessCode">Понятно — к оплате</button>
      </div></div>`;
      const copyBtn = $("copyAccessCode");
      if (copyBtn) copyBtn.onclick = () => navigator.clipboard.writeText(code);
      const ok = $("okAccessCode");
      if (ok) ok.onclick = () => { host.innerHTML = ""; if (onOk) onOk(); };
    }

    window.pollOrder = async function() {
      const token = state.orderToken || localStorage.getItem("aim_last_order");
      if (!token) return;
      try {
        let q = "/web/order/" + encodeURIComponent(token);
        if (state.accountId && state.sessionSecret) {
          q += "?account_id=" + encodeURIComponent(state.accountId)
            + "&session_secret=" + encodeURIComponent(state.sessionSecret);
        }
        const data = await api(q);
        renderOrder(data);
        if (data.status === "completed" || data.subscription_url) await refreshMe();
      } catch (_) {}
    };

    window.startLink = async function() {
      const box = $("linkMsg");
      if (!state.accountId || !state.sessionSecret) {
        // Create session without VPN purchase, then issue link token.
        try {
          if (box) box.textContent = "Готовим сессию сайта…";
          const ens = await api("/web/session/ensure", {
            method: "POST",
            body: JSON.stringify({
              account_id: null,
              session_secret: null,
              ref_code: state.ref || null,
            }),
          });
          saveSession(ens.account_id, ens.session_secret);
          await refreshMe();
        } catch (_) {
          if (box) {
            box.innerHTML =
              "<p class='warn'>Не удалось создать сессию. Обновите страницу.</p>";
          }
          return;
        }
      }
      try {
        const data = await api("/web/link/start", {
          method: "POST",
          body: JSON.stringify({ account_id: state.accountId, session_secret: state.sessionSecret }),
        });
        if (data.already_linked) {
          if (box) box.textContent = "Уже привязано";
          await refreshMe();
          return;
        }
        const bot = (data.deep_link || "").match(/t\.me\/([^?]+)/);
        const domain = bot ? bot[1] : "AiMonkeyStars_bot";
        const code = data.code || "";
        const startPayload = "link_" + code;
        const tgApp = "tg://resolve?domain=" + encodeURIComponent(domain) + "&start=" + encodeURIComponent(startPayload);
        const httpsLink = data.deep_link;
        if (box) {
          box.innerHTML =
            "<div style='text-align:left'>" +
            "<p><b>Связать через приложение Telegram</b> (не Safari).</p>" +
            "<ol class='steps'>" +
            "<li>Нажмите <b>Открыть в приложении Telegram</b>.</li>" +
            "<li>В боте @" + domain + " нажмите <b>Запустить / Start</b>.</li>" +
            "<li>Вернитесь на сайт — статус станет «Telegram привязан».</li>" +
            "</ol>" +
            "<p class='muted'>Если в Safari видите «Отключите VPN» — закройте вкладку. Включите VPN при необходимости, откройте <b>приложение</b> Telegram и отправьте боту:</p>" +
            "<p><code id='linkPayloadCode'>" + startPayload + "</code> " +
            "<button class='btn secondary' type='button' id='copyLinkCodeBtn'>Скопировать код</button></p>" +
            "<p class='muted'>Код действует ~" + (data.expires_minutes || 30) + " мин. Сайт/ВК можно без VPN; для Telegram VPN — только на шаг привязки.</p>" +
            `<p><a class="btn" id="openTgLink" href="${tgApp}">Открыть в приложении Telegram</a></p>` +
            `<p class="muted"><a href="${httpsLink}" target="_blank" rel="noopener">Запасная ссылка https://t.me (если приложения нет)</a></p>` +
            "</div>";
          const copyBtn = document.getElementById("copyLinkCodeBtn");
          if (copyBtn) {
            copyBtn.onclick = async function() {
              try {
                await navigator.clipboard.writeText(startPayload);
                copyBtn.textContent = "Скопировано";
              } catch (_) {
                copyBtn.textContent = "Выделите код вручную";
              }
            };
          }
        }
        try { location.href = tgApp; } catch (_) {}
      } catch (e) {
        if (box) {
          const code = e && e.data && e.data.detail && e.data.detail.code;
          box.textContent = code === "unauthorized"
            ? "Сессия сайта устарела. Нажмите «Связать Telegram» ещё раз."
            : "Не удалось создать ссылку привязки. Обновите страницу или напишите в поддержку.";
        }
      }
    };
    window.startLinkFromOrder = window.startLink;

    window.goCabinet = async function() {
      await refreshMe();
      showTab("home");
      renderAll();
    };

    async function refreshMe() {
      if (!state.accountId || !state.sessionSecret) return;
      try {
        state.me = await api(`/web/me?account_id=${encodeURIComponent(state.accountId)}&session_secret=${encodeURIComponent(state.sessionSecret)}`);
        if (state.me && state.me.support_url) state.supportUrl = state.me.support_url;
        if (state.me && state.me.nickname) {
          state.nickname = state.me.nickname;
          localStorage.setItem("aim_nickname", state.me.nickname);
          const b = $("brand");
          if (b) {
            b.classList.add("brand-gold");
            b.textContent = (state.me.brand || t("brand")) + " · @" + state.me.nickname;
          }
        }
      } catch (_) { state.me = null; }
    }

    function renderAll() {
      renderHome(); renderDevices(); renderSubs(); renderBonus(); renderProfile();
    }

    function tabFromLocation() {
      const path = location.pathname || "/";
      const hash = (location.hash || "").replace(/^#/, "");
      if (/^\/o\//.test(path) || /^\/web\/o\//.test(path)) return "order";
      if (/\/devices\/?$/.test(path) || hash === "devices") return "devices";
      if (hash === "subs" || hash === "bonus" || hash === "profile" || hash === "home") return hash;
      return "home";
    }

    document.querySelectorAll(".nav button").forEach(b => {
      b.addEventListener("click", async () => {
        showTab(b.dataset.tab);
        if (b.dataset.tab === "devices") await refreshDevices();
        renderAll();
      });
    });

    document.querySelectorAll("#langSwitch .lang-switch__btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
    });
    applyStaticI18n();

    function readCookie(name) {
      try {
        const m = document.cookie.match(
          new RegExp("(?:^|; )" + name.replace(/([.$?*|{}()[\]\\/+^])/g, "\\$1") + "=([^;]*)")
        );
        return m ? decodeURIComponent(m[1]) : "";
      } catch (_) {
        return "";
      }
    }

    function captureRefOnce(incoming) {
      const v = String(incoming || "").trim();
      if (!v) return;
      if (!localStorage.getItem("aim_ref")) {
        state.ref = v;
        localStorage.setItem("aim_ref", v);
      } else {
        state.ref = localStorage.getItem("aim_ref") || "";
      }
    }

    (async function init() {
      const path = location.pathname;
      const params = new URLSearchParams(location.search);
      if (params.get("ref")) {
        captureRefOnce(params.get("ref"));
      }
      const oMatch = path.match(/\/o\/([^/]+)/) || path.match(/\/web\/o\/([^/]+)/);
      const rMatch = path.match(/\/r\/([^/]+)/);
      if (rMatch) {
        captureRefOnce(decodeURIComponent(rMatch[1]));
      }
      // Cookie from GET /r/{code} redirect — if SPA missed ?ref=
      if (!localStorage.getItem("aim_ref")) {
        captureRefOnce(readCookie("aim_ref"));
      } else if (!state.ref) {
        state.ref = localStorage.getItem("aim_ref") || "";
      }
      // Сразу нужная вкладка — до сетевых запросов (иначе 1–5с «Главная» на /devices).
      const initialTab = tabFromLocation();
      showTab(initialTab, { syncUrl: false });
      try {
        const prod = await api("/web/products");
        state.products = prod.products || [];
        if (prod.brand) { const bb=$("brand"); if(bb){ bb.classList.add("brand-gold"); bb.textContent = prod.brand; } document.title = prod.brand; }
        if (prod.support_url) state.supportUrl = prod.support_url;
        if (state.products[0]) state.selected = state.products[0].id;
      } catch (_) {}
      await refreshMe();
      await refreshDevices();
      applyStaticI18n();
      renderAll();
      if (oMatch) {
        state.orderToken = decodeURIComponent(oMatch[1]);
        localStorage.setItem("aim_last_order", state.orderToken);
        state.tab = "order";
        await pollOrder();
      } else {
        // Не сбрасывать вкладку, которую пользователь уже выбрал, пока грузились данные.
        showTab(state.tab || initialTab, { syncUrl: true });
      }
    })();
  </script>
</body>
</html>
