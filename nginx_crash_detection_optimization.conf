# 🚀 CRASH DETECTION - NGINX ОПТИМИЗАЦИЯ
# Дата: 6 февраля 2026 г.
# HTTP/2 + GZIP + Connection Pooling

upstream crash_detection_backend {
    # Connection pooling
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;

    server 127.0.0.1:8000;  # FastAPI сервер
}

server {
    listen 8002 http2;  # HTTP/2 включен
    server_name aladdin-server;

    # SSL конфигурация (если есть сертификат)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # GZIP сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # Кэширование
    location /api/crash-detection/ {
        proxy_pass http://crash_detection_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # HTTP/2 push для связанных ресурсов
        http2_push /api/health;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Буферы
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Кэширование ответов (если применимо)
        proxy_cache crash_detection_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout invalid_header updating;
    }

    # Health check без кэширования
    location /api/health {
        proxy_pass http://crash_detection_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# Кэш зона
proxy_cache_path /var/cache/nginx/crash_detection
    levels=1:2
    keys_zone=crash_detection_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;
