name: Build and Upload to App Store

on:
  workflow_dispatch:  # Запуск вручную через GitHub UI
  push:
    tags:
      - 'v*'  # Автоматически при создании тега v1.0.0, v1.0.1 и т.д.

jobs:
  build-and-upload:
    name: Build and Upload to App Store Connect
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Build Archive
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcodebuild archive \
          -project ALADDIN.xcodeproj \
          -scheme ALADDIN \
          -configuration Release \
          -archivePath ALADDIN.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
        
    - name: List Archive Contents
      run: |
        echo "Checking archive..."
        ls -la ALADDIN.xcarchive/Products/Applications/ 2>&1 || echo "Archive not found or empty"
        
    - name: Export IPA
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath ALADDIN.xcarchive \
          -exportPath Export \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates
        echo "Checking exported files..."
        ls -la Export/ 2>&1 || echo "Export directory not found"
        
    - name: Upload to App Store Connect
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file "Export/ALADDIN.ipa" \
          --username "$APPLE_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD"
        
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ALADDIN-IPA
        path: Export/ALADDIN.ipa
        retention-days: 30

