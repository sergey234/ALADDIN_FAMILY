name: Build and Upload to App Store

on:
  workflow_dispatch:  # Запуск вручную через GitHub UI
  push:
    tags:
      - 'v*'  # Автоматически при создании тега v1.0.0, v1.0.1 и т.д.

jobs:
  build-and-upload:
    name: Build and Upload to App Store Connect
    runs-on: macos-14  # Используем macOS 14 для поддержки Xcode 16
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'  # Используем Xcode 16.2.0 для iOS 18 SDK
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Setup Signing Certificate
      run: |
        echo "🔐 Setting up signing certificate..."
        
        if [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}" ] || [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" ]; then
          echo "⚠️  Signing certificate not provided, will use automatic signing"
          echo "CERTIFICATE_AVAILABLE=false" >> $GITHUB_ENV
          echo "✅ Will use automatic signing with App Store Connect API"
          exit 0
        fi
        
        # Создать временный keychain
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain"
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        
        # Удалить старый keychain если существует
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        
        # Создать новый keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Импортировать сертификат
        echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}" | base64 -d > /tmp/certificate.p12
        if [ ! -f /tmp/certificate.p12 ] || [ ! -s /tmp/certificate.p12 ]; then
          echo "❌ Failed to decode certificate (invalid base64 or empty file)"
          exit 1
        fi
        
        security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to import certificate (wrong password or invalid certificate)"
          exit 1
        fi
        
        # Настроить keychain для codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Добавить keychain в список поиска
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
        
        # Проверить что сертификат установлен
        CERT_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "iPhone Distribution" | wc -l | tr -d ' ')
        if [ "$CERT_COUNT" -eq 0 ]; then
          echo "❌ No 'iPhone Distribution' certificate found in keychain!"
          echo "Available certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi
        
        echo "✅ Signing certificate installed and verified"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "iPhone Distribution" || true
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
        echo "CERTIFICATE_AVAILABLE=true" >> $GITHUB_ENV
        
    - name: Setup Provisioning Profiles
      run: |
        echo "Setting up provisioning profiles..."
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        
        # Декодировать и сохранить profiles из secrets
        if [ -z "${{ secrets.PROVISIONING_PROFILE_APP }}" ]; then
          echo "❌ PROVISIONING_PROFILE_APP secret is not set!"
          exit 1
        fi
        
        echo "Decoding app provisioning profile..."
        echo "${{ secrets.PROVISIONING_PROFILE_APP }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision 2>&1
        if [ $? -ne 0 ]; then
          echo "❌ Failed to decode PROVISIONING_PROFILE_APP (invalid base64)"
          exit 1
        fi
        
        # Извлечь UUID из профиля для использования в xcodebuild
        APP_PROFILE_UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
        if [ -z "$APP_PROFILE_UUID" ]; then
          # Альтернативный способ: поиск UUID в тексте
          APP_PROFILE_UUID=$(strings ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
        fi
        
        if [ -n "$APP_PROFILE_UUID" ]; then
          # Переименовать файл в формат UUID.mobileprovision (Xcode автоматически находит)
          mv ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${APP_PROFILE_UUID}.mobileprovision
          echo "✅ App provisioning profile installed with UUID: $APP_PROFILE_UUID"
          echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV
        else
          echo "⚠️  Could not extract UUID, keeping default name"
          echo "APP_PROFILE_PATH=~/Library/MobileDevice/Provisioning Profiles/app.mobileprovision" >> $GITHUB_ENV
        fi
        
        if [ -z "${{ secrets.PROVISIONING_PROFILE_EXTENSION }}" ]; then
          echo "❌ PROVISIONING_PROFILE_EXTENSION secret is not set!"
          exit 1
        fi
        
        echo "Decoding extension provisioning profile..."
        echo "${{ secrets.PROVISIONING_PROFILE_EXTENSION }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/extension.mobileprovision 2>&1
        if [ $? -ne 0 ]; then
          echo "❌ Failed to decode PROVISIONING_PROFILE_EXTENSION (invalid base64)"
          echo "⚠️  Проверьте, что секрет содержит валидный base64"
          exit 1
        fi
        
        # Извлечь UUID из профиля extension
        EXT_PROFILE_UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/extension.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
        if [ -z "$EXT_PROFILE_UUID" ]; then
          # Альтернативный способ: поиск UUID в тексте
          EXT_PROFILE_UUID=$(strings ~/Library/MobileDevice/Provisioning\ Profiles/extension.mobileprovision | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
        fi
        
        if [ -n "$EXT_PROFILE_UUID" ]; then
          # Переименовать файл в формат UUID.mobileprovision
          mv ~/Library/MobileDevice/Provisioning\ Profiles/extension.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${EXT_PROFILE_UUID}.mobileprovision
          echo "✅ Extension provisioning profile installed with UUID: $EXT_PROFILE_UUID"
          echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> $GITHUB_ENV
        else
          echo "⚠️  Could not extract UUID, keeping default name"
          echo "EXT_PROFILE_PATH=~/Library/MobileDevice/Provisioning Profiles/extension.mobileprovision" >> $GITHUB_ENV
        fi
        
        # Проверить установленные profiles
        echo ""
        echo "📋 Installed provisioning profiles:"
        ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
        
        # Проверить что profiles правильные
        if [ -n "$APP_PROFILE_UUID" ]; then
          APP_PROFILE_FILE="$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          if [ -f "$APP_PROFILE_FILE" ]; then
            echo ""
            echo "📋 Checking app provisioning profile..."
            APP_PROFILE_INFO=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null)
            if [ -n "$APP_PROFILE_INFO" ]; then
              APP_PROFILE_TEAM=$(echo "$APP_PROFILE_INFO" | plutil -extract TeamName raw -o - - 2>/dev/null || echo "")
              APP_PROFILE_BUNDLE=$(echo "$APP_PROFILE_INFO" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
              APP_PROFILE_TYPE=$(echo "$APP_PROFILE_INFO" | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null | head -1 || echo "")
              
              echo "  Team: $APP_PROFILE_TEAM"
              echo "  Bundle ID: $APP_PROFILE_BUNDLE"
              if [ -z "$APP_PROFILE_TYPE" ]; then
                echo "  Type: Distribution (App Store)"
              else
                echo "  Type: Development"
              fi
              
              # Проверить что это не Xcode managed profile
              if echo "$APP_PROFILE_INFO" | grep -q "Xcode Managed" || echo "$APP_PROFILE_INFO" | grep -q "iOS Team"; then
                echo "  ⚠️  WARNING: This appears to be an Xcode managed profile!"
                echo "  ⚠️  Manual signing requires manually managed profiles from developer.apple.com"
              fi
            fi
          fi
        fi
        
        if [ -n "$EXT_PROFILE_UUID" ]; then
          EXT_PROFILE_FILE="$HOME/Library/MobileDevice/Provisioning Profiles/${EXT_PROFILE_UUID}.mobileprovision"
          if [ -f "$EXT_PROFILE_FILE" ]; then
            echo ""
            echo "📋 Checking extension provisioning profile..."
            EXT_PROFILE_INFO=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null)
            if [ -n "$EXT_PROFILE_INFO" ]; then
              EXT_PROFILE_TEAM=$(echo "$EXT_PROFILE_INFO" | plutil -extract TeamName raw -o - - 2>/dev/null || echo "")
              EXT_PROFILE_BUNDLE=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
              EXT_PROFILE_NETWORK=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements."com.apple.developer.networking.networkextension" raw -o - - 2>/dev/null || echo "")
              EXT_PROFILE_VPN=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements."com.apple.developer.networking.vpn.api" raw -o - - 2>/dev/null || echo "")
              
              echo "  Team: $EXT_PROFILE_TEAM"
              echo "  Bundle ID: $EXT_PROFILE_BUNDLE"
              if [ -n "$EXT_PROFILE_NETWORK" ]; then
                echo "  ✅ Network Extensions: Supported"
              else
                echo "  ❌ Network Extensions: NOT SUPPORTED!"
              fi
              if [ -n "$EXT_PROFILE_VPN" ]; then
                echo "  ✅ VPN API: Supported"
              else
                echo "  ❌ VPN API: NOT SUPPORTED!"
              fi
              
              # Проверить что это не Xcode managed profile
              if echo "$EXT_PROFILE_INFO" | grep -q "Xcode Managed" || echo "$EXT_PROFILE_INFO" | grep -q "iOS Team"; then
                echo "  ⚠️  WARNING: This appears to be an Xcode managed profile!"
                echo "  ⚠️  Manual signing requires manually managed profiles from developer.apple.com"
              fi
              
              # Проверить bundle ID
              if [ "$EXT_PROFILE_BUNDLE" != "family.aladdin.ios.packetTunnel" ]; then
                echo "  ⚠️  WARNING: Bundle ID mismatch! Expected: family.aladdin.ios.packetTunnel, Got: $EXT_PROFILE_BUNDLE"
              fi
            fi
          fi
        fi
        
    - name: Build Archive (with signing)
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        echo "Building archive with manual signing..."
        echo "Team ID: $APPLE_TEAM_ID"
        echo "Bundle ID: family.aladdin.ios"
        echo "App Profile UUID: $APP_PROFILE_UUID"
        echo "Extension Profile UUID: $EXT_PROFILE_UUID"
        
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        
        # Проверить доступность сертификата
        # Если CERTIFICATE_AVAILABLE не установлен, используем Manual signing с provisioning profiles
        # Xcode должен найти сертификат автоматически или использовать Cloud Managed Certificate
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          echo "⚠️  Certificate not in secrets, using Manual signing with provisioning profiles"
          echo "Xcode will try to find certificate automatically or use Cloud Managed Certificate"
          
          # Проверить что UUID профилей извлечены
          if [ -z "$APP_PROFILE_UUID" ] || [ -z "$EXT_PROFILE_UUID" ]; then
            echo "❌ Failed to extract provisioning profile UUIDs!"
            echo "APP_PROFILE_UUID: $APP_PROFILE_UUID"
            echo "EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
            exit 1
          fi
          
          echo "✅ Using Manual signing with provisioning profiles from secrets"
          echo "Using extracted UUIDs for provisioning profiles"
          echo "⚠️  Note: Xcode will try to find certificate automatically"
          
          # Используем Manual signing с provisioning profiles
          # Не указываем CODE_SIGN_IDENTITY - Xcode найдет автоматически
          # Попробуем сначала без указания сертификата
          xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDIN_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER="$EXT_PROFILE_UUID" || \
          # Если не сработало, попробуем с Apple Distribution
          xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDIN_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
        elif [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          echo "✅ Using manual signing with certificate"
          
          # Проверить что UUID профилей извлечены
          if [ -z "$APP_PROFILE_UUID" ] || [ -z "$EXT_PROFILE_UUID" ]; then
            echo "❌ Failed to extract provisioning profile UUIDs!"
            echo "APP_PROFILE_UUID: $APP_PROFILE_UUID"
            echo "EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
            exit 1
          fi
          
          echo "Using extracted UUIDs for provisioning profiles"
          
          # Установить keychain для использования в xcodebuild
          export KEYCHAIN_PATH="${{ env.KEYCHAIN_PATH }}"
          export KEYCHAIN_PASSWORD="${{ env.KEYCHAIN_PASSWORD }}"
          
          xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDIN_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
        else
          echo "⚠️  Certificate not available, using automatic signing with -allowProvisioningUpdates"
          echo "This requires App Store Connect API access"
          
          # Проверить наличие API ключей
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] || \
             [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] || \
             [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "❌ App Store Connect API keys not set!"
            echo "Please add:"
            echo "  - APP_STORE_CONNECT_API_KEY"
            echo "  - APP_STORE_CONNECT_ISSUER_ID"
            echo "  - APP_STORE_CONNECT_API_KEY_ID"
            echo ""
            echo "Or add signing certificate:"
            echo "  - IOS_DISTRIBUTION_CERTIFICATE"
            echo "  - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
            exit 1
          fi
          
          echo "✅ Using automatic signing with provisioning updates"
          xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates
        fi
        
    - name: List Archive Contents
      run: |
        echo "Checking archive..."
        ls -la ./build/ALADDIN.xcarchive/Products/Applications/ 2>&1 || echo "Archive not found or empty"
        
    - name: Export IPA
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Exporting IPA..."
        mkdir -p ./build/export
        
        # Извлечь UUID профилей для ExportOptions
        APP_PROFILE_UUID="${{ env.APP_PROFILE_UUID }}"
        EXT_PROFILE_UUID="${{ env.EXT_PROFILE_UUID }}"
        
        # Если UUID не извлечены, используем bundle ID (Xcode найдет профили автоматически)
        if [ -z "$APP_PROFILE_UUID" ]; then
          APP_PROFILE_UUID="family.aladdin.ios"
        fi
        if [ -z "$EXT_PROFILE_UUID" ]; then
          EXT_PROFILE_UUID="family.aladdin.ios.packetTunnel"
        fi
        
        # Создать ExportOptions.plist для Manual signing
        cat > ./build/ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>signingCertificate</key>
          <string>iPhone Distribution</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>family.aladdin.ios</key>
            <string>$APP_PROFILE_UUID</string>
            <key>family.aladdin.ios.packetTunnel</key>
            <string>$EXT_PROFILE_UUID</string>
          </dict>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
          <key>compileBitcode</key>
          <false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath ./build/ALADDIN.xcarchive \
          -exportPath ./build/export \
          -exportOptionsPlist ./build/ExportOptions.plist
        
        echo "Checking exported files..."
        ls -la ./build/export/ 2>&1 || echo "Export directory not found"
        
        # Найти .ipa файл
        IPA_FILE=$(find ./build/export -name "*.ipa" | head -1)
        echo "IPA file: $IPA_FILE"
        if [ -z "$IPA_FILE" ]; then
          echo "Error: IPA file not found!"
          exit 1
        fi
        echo "IPA_FILE_PATH=$IPA_FILE" >> $GITHUB_ENV
        
    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      run: |
        if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
          echo "⚠️ App Store Connect API keys not set"
          echo "IPA file will be available as artifact for manual upload"
          echo "IPA file: ${{ env.IPA_FILE_PATH }}"
          exit 0
        fi
        
        # Используем apple-actions для загрузки
        echo "Uploading to App Store Connect..."
        # Создаём временный файл с API ключом
        echo "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey.p8
        chmod 600 /tmp/AuthKey.p8
        
        # Используем fastlane или apple-actions для загрузки
        # Для начала просто проверим, что файл существует
        if [ ! -f "${{ env.IPA_FILE_PATH }}" ]; then
          echo "Error: IPA file not found at ${{ env.IPA_FILE_PATH }}"
          exit 1
        fi
        
        echo "IPA file found: ${{ env.IPA_FILE_PATH }}"
        echo "Ready to upload to App Store Connect"
        
    - name: Upload to App Store Connect using apple-actions
      if: env.APP_STORE_CONNECT_API_KEY != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != ''
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ env.IPA_FILE_PATH }}
        api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always() && env.IPA_FILE_PATH != ''
      with:
        name: ALADDIN-IPA
        path: ${{ env.IPA_FILE_PATH }}
        retention-days: 30
        if-no-files-found: warn
        
    - name: Cleanup Keychain
      if: always() && env.CERTIFICATE_AVAILABLE == 'true'
      run: |
        echo "Cleaning up keychain..."
        if [ -n "${{ env.KEYCHAIN_PATH }}" ] && [ -f "${{ env.KEYCHAIN_PATH }}" ]; then
          security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
          echo "✅ Keychain cleaned up"
        fi
