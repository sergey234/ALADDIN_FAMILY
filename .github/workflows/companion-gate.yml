name: Companion Gate

on:
  push:
    branches: [main, develop]
    paths:
      - 'Resources/Companion/**'
      - 'UI/Companion/**'
      - 'Core/Companion/**'
      - 'security/**/companion*.py'
      - 'security/**/ai_companion_router.py'
      - 'Tests/test_companion*.py'
      - 'Tests/fixtures/companion_golden/**'
      - 'scripts/run_companion_tests.sh'
      - 'scripts/verify_hero_x_phase6.sh'
      - 'scripts/count_companion_parametrize.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Resources/Companion/**'
      - 'UI/Companion/**'
      - 'Core/Companion/**'
      - 'security/**/companion*.py'
      - 'security/**/ai_companion_router.py'
      - 'Tests/test_companion*.py'
      - 'Tests/fixtures/companion_golden/**'
      - 'scripts/run_companion_tests.sh'
      - 'scripts/verify_hero_x_phase6.sh'
      - 'scripts/count_companion_parametrize.py'

jobs:
  companion-python-gate:
    name: Rive gate + companion tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r Tests/requirements-test.txt

      - name: HERO-3-22 — .riv size gate
        run: python3 scripts/companion_riv_size_gate.py --dir Resources/Companion

      - name: Companion unit tests
        run: PYTHONPATH=. python3 -m pytest Tests/test_companion_*.py -q

      - name: hero-x phase 6 gate (golden + ethics + l10n)
        run: chmod +x scripts/verify_hero_x_phase6.sh && ./scripts/verify_hero_x_phase6.sh
