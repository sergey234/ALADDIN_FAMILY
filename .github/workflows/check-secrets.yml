            # Попробовать найти UUID в сыром файле через hexdump
            set +e
            HEX_UUID=$(hexdump -C "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
            set -e
            if [ -n "$HEX_UUID" ] && [[ "$HEX_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              EXT_PROFILE_UUID="$HEX_UUID"
              echo "✅ UUID extracted via hexdump: $EXT_PROFILE_UUID"
            fi
          fi
        fi
        
        # КРИТИЧЕСКИ ВАЖНО: Переименовать файл в UUID.mobileprovision ДО установки переменных
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
