          exit 1
        fi
        
        # Проверить размер файла
        FILE_SIZE=$(wc -c < "$PROFILE_DIR/extension.mobileprovision" | tr -d ' ')
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "❌ Extension profile file is too small ($FILE_SIZE bytes), decoding may have failed"
          exit 1
        fi
        
        # Проверить валидность профиля
        set +e
        PROFILE_INFO=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>&1)
        SECURITY_EXIT=$?
        set -e
        
        if [ $SECURITY_EXIT -eq 0 ]; then
          PROFILE_NAME=$(echo "$PROFILE_INFO" | plutil -extract Name raw -o - - 2>/dev/null || echo "unknown")
          echo "✅ Extension profile is valid: $PROFILE_NAME"
        fi
        
        echo "✅ Extension profile decoded successfully ($FILE_SIZE bytes)"
        
    - name: Extract Extension Profile UUID
