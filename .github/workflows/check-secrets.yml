          echo "EXT_PROFILE_UUID=" >> $GITHUB_ENV
          exit 0
        fi
        set +e
        PLUTIL_OUTPUT=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>&1)
        PLUTIL_EXIT=$?
        set -e
        
        # ДИАГНОСТИКА: Проверить что профиль декодируется
        if [ $PLUTIL_EXIT -ne 0 ]; then
          echo "❌ Failed to decode extension profile XML (exit code: $PLUTIL_EXIT)"
          echo "   Error output: $PLUTIL_OUTPUT"
        elif [ -z "$PLUTIL_OUTPUT" ]; then
          echo "⚠️  Extension profile XML is empty"
        else
          echo "✅ Extension profile XML decoded successfully"
          echo "   XML length: $(echo -n "$PLUTIL_OUTPUT" | wc -c | tr -d ' ') characters"
        fi
        
        if [ $PLUTIL_EXIT -eq 0 ] && [ -n "$PLUTIL_OUTPUT" ]; then
          set +e
          # Метод 1: plutil
          EXT_PROFILE_UUID=$(echo "$PLUTIL_OUTPUT" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
          set -e
          if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "✅ UUID extracted via plutil: $EXT_PROFILE_UUID"
          else
            EXT_PROFILE_UUID=""
            echo "⚠️  plutil failed to extract UUID, trying other methods..."
          fi
        fi
        
        # Метод 2: Через awk (РАБОТАЕТ! Находит UUID в диагностике)
        if [ -z "$EXT_PROFILE_UUID" ] && [ $PLUTIL_EXIT -eq 0 ] && [ -n "$PLUTIL_OUTPUT" ]; then
          set +e
          echo "🔍 Trying awk method to extract UUID from XML..."
          # awk работает! Находит UUID в диагностике
          AWK_UUID=$(echo "$PLUTIL_OUTPUT" | awk '/<key>UUID<\/key>/{getline; if(/<string>/){gsub(/.*<string>|<\/string>.*/,""); print; exit}}' | tr -d '\t ' || echo "")
          set -e
          echo "   🔍 Debug: AWK_UUID after extraction: '$AWK_UUID'"
          echo "   🔍 Debug: AWK_UUID length: $(echo -n "$AWK_UUID" | wc -c | tr -d ' ')"
          if [ -n "$AWK_UUID" ]; then
            echo "   🔍 Debug: AWK_UUID is not empty, checking regex..."
            # Используем case-insensitive regex для UUID (может быть в нижнем регистре)
            if [[ "$AWK_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              EXT_PROFILE_UUID="$AWK_UUID"
              echo "✅ UUID extracted via awk: $EXT_PROFILE_UUID"
            else
              echo "   ⚠️  AWK_UUID doesn't match regex pattern"
