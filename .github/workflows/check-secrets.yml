name: Build and Upload to App Store

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

jobs:
  build-and-upload:
    name: Build and Upload to App Store Connect
    runs-on: macos-14  # Используем macOS 14 для поддержки Xcode 16
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'  # Используем Xcode 16.2.0 для iOS 18 SDK
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Setup Signing Certificate
      run: |
        echo "🔐 Setting up signing certificate..."
        
        if [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}" ] || [ -z "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" ]; then
          echo "⚠️  Signing certificate not provided, will use automatic signing"
          echo "CERTIFICATE_AVAILABLE=false" >> $GITHUB_ENV
          echo "✅ Will use automatic signing with App Store Connect API"
          exit 0
        fi
        
        # Создать временный keychain
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain"
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        
        # Удалить старый keychain если существует
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        
        # Создать новый keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Импортировать сертификат
        echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}" | base64 -d > /tmp/certificate.p12
        if [ ! -f /tmp/certificate.p12 ] || [ ! -s /tmp/certificate.p12 ]; then
          echo "❌ Failed to decode certificate (invalid base64 or empty file)"
          exit 1
        fi
        
        security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to import certificate (wrong password or invalid certificate)"
          exit 1
        fi
        
        # Настроить keychain для codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Добавить keychain в список поиска
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
        
        # Проверить что сертификат установлен
        # Ищем "Apple Distribution" или "iPhone Distribution" (оба варианта валидны)
        CERT_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "distribution" | wc -l | tr -d ' ')
        if [ "$CERT_COUNT" -eq 0 ]; then
          echo "❌ No Distribution certificate found in keychain!"
          echo "Available certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi
        
        echo "✅ Signing certificate installed and verified"
        echo "Found Distribution certificate:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "distribution" || true
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
        echo "CERTIFICATE_AVAILABLE=true" >> $GITHUB_ENV
        
    - name: Setup Provisioning Profiles
      run: |
        echo "Setting up provisioning profiles..."
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        
        # Декодировать и сохранить profiles из secrets
        if [ -z "${{ secrets.PROVISIONING_PROFILE_APP }}" ]; then
          echo "❌ PROVISIONING_PROFILE_APP secret is not set!"
          exit 1
        fi
        
        echo "Decoding app provisioning profile..."
        echo "${{ secrets.PROVISIONING_PROFILE_APP }}" | base64 -d > "$PROFILE_DIR/app.mobileprovision" 2>&1
        DECODE_EXIT_CODE=$?
        if [ $DECODE_EXIT_CODE -ne 0 ]; then
          echo "❌ Failed to decode PROVISIONING_PROFILE_APP (invalid base64)"
          echo "Exit code: $DECODE_EXIT_CODE"
          echo "First 100 chars of secret: $(echo "${{ secrets.PROVISIONING_PROFILE_APP }}" | head -c 100)"
          exit 1
        fi
        
        # Проверить что файл создан и не пустой
        if [ ! -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "❌ Profile file was not created after decoding"
          exit 1
        fi
        
        FILE_SIZE=$(wc -c < "$PROFILE_DIR/app.mobileprovision" | tr -d ' ')
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "❌ Profile file is too small ($FILE_SIZE bytes), decoding may have failed"
          exit 1
        fi
        
        echo "✅ Profile decoded successfully ($FILE_SIZE bytes)"
        
        # Извлечь UUID из профиля для использования в xcodebuild
        echo "🔍 Extracting UUID from app profile..."
        APP_PROFILE_UUID=""
        
        # Проверить что файл существует и читается
        if [ ! -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "❌ Profile file not found: $PROFILE_DIR/app.mobileprovision"
        else
          echo "✅ Profile file exists, size: $(wc -c < "$PROFILE_DIR/app.mobileprovision" | tr -d ' ') bytes"
          
          # Способ 1: через plutil (с обработкой ошибок)
          echo "  Trying plutil method..."
          set +e  # Отключить exit on error для этого блока
          PLUTIL_OUTPUT=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>&1)
          PLUTIL_EXIT=$?
          set -e  # Включить обратно
          
          if [ $PLUTIL_EXIT -eq 0 ] && [ -n "$PLUTIL_OUTPUT" ]; then
            set +e  # Отключить exit on error для plutil
            APP_PROFILE_UUID=$(echo "$PLUTIL_OUTPUT" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            PLUTIL_UUID_EXIT=$?
            set -e  # Включить обратно
            
            # Проверить что это валидный UUID
            if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "✅ UUID extracted via plutil: $APP_PROFILE_UUID"
            else
              echo "⚠️  plutil returned invalid UUID: '$APP_PROFILE_UUID' (exit code: $PLUTIL_UUID_EXIT)"
              APP_PROFILE_UUID=""
            fi
          else
            echo "⚠️  security cms failed with exit code $PLUTIL_EXIT"
            if [ -n "$PLUTIL_OUTPUT" ]; then
              echo "   Error: $(echo "$PLUTIL_OUTPUT" | head -3)"
            fi
          fi
          
          # Способ 2: через strings (если plutil не сработал)
          if [ -z "$APP_PROFILE_UUID" ]; then
            echo "  Trying strings method..."
            set +e  # Отключить exit on error
            STRINGS_OUTPUT=$(strings "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            set -e  # Включить обратно
            
            if [ -n "$STRINGS_OUTPUT" ] && [[ "$STRINGS_OUTPUT" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              APP_PROFILE_UUID="$STRINGS_OUTPUT"
              echo "✅ UUID extracted via strings: $APP_PROFILE_UUID"
            else
              echo "⚠️  strings method found no valid UUID"
              # Показать первые найденные UUID-подобные строки для диагностики
              set +e
              echo "   Found UUID-like strings:"
              strings "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -3 | sed 's/^/     /' || echo "     (none found)"
              set -e
            fi
          fi
        fi
        
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Переименовать файл в формат UUID.mobileprovision (Xcode автоматически находит)
          mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
          echo "✅ App provisioning profile installed with UUID: $APP_PROFILE_UUID"
          echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV
        else
          echo "⚠️  Could not extract UUID, keeping default name"
          echo "APP_PROFILE_PATH=$PROFILE_DIR/app.mobileprovision" >> $GITHUB_ENV
        fi
        
        if [ -z "${{ secrets.PROVISIONING_PROFILE_EXTENSION }}" ]; then
          echo "❌ PROVISIONING_PROFILE_EXTENSION secret is not set!"
          echo ""
          echo "⚠️  Для продолжения необходимо установить секрет PROVISIONING_PROFILE_EXTENSION"
          echo "   Перейдите в: Settings → Secrets and variables → Actions"
          echo "   Добавьте секрет: PROVISIONING_PROFILE_EXTENSION"
          echo ""
          echo "⚠️  Продолжаем без extension profile (может вызвать ошибки при сборке)"
          echo "EXT_PROFILE_UUID=" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "Decoding extension provisioning profile..."
        echo "${{ secrets.PROVISIONING_PROFILE_EXTENSION }}" | base64 -d > "$PROFILE_DIR/extension.mobileprovision" 2>&1
        DECODE_EXIT_CODE=$?
        if [ $DECODE_EXIT_CODE -ne 0 ]; then
          echo "❌ Failed to decode PROVISIONING_PROFILE_EXTENSION (invalid base64)"
          echo "Exit code: $DECODE_EXIT_CODE"
          echo "⚠️  Проверьте, что секрет содержит валидный base64"
          exit 1
        fi
        
        # Проверить что файл создан и не пустой
        if [ ! -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "❌ Extension profile file was not created after decoding"
          exit 1
        fi
        
        FILE_SIZE=$(wc -c < "$PROFILE_DIR/extension.mobileprovision" | tr -d ' ')
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "❌ Extension profile file is too small ($FILE_SIZE bytes), decoding may have failed"
          exit 1
        fi
        
        echo "✅ Extension profile decoded successfully ($FILE_SIZE bytes)"
        
        # Извлечь UUID из профиля extension
        echo "🔍 Extracting UUID from extension profile..."
        EXT_PROFILE_UUID=""
        
        # Проверить что файл существует и читается
        if [ ! -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "❌ Extension profile file not found: $PROFILE_DIR/extension.mobileprovision"
        else
          echo "✅ Extension profile file exists, size: $(wc -c < "$PROFILE_DIR/extension.mobileprovision" | tr -d ' ') bytes"
          
          # Способ 1: через plutil (с обработкой ошибок)
          echo "  Trying plutil method..."
          set +e  # Отключить exit on error для этого блока
          PLUTIL_OUTPUT=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>&1)
          PLUTIL_EXIT=$?
          set -e  # Включить обратно
          
          if [ $PLUTIL_EXIT -eq 0 ] && [ -n "$PLUTIL_OUTPUT" ]; then
            set +e  # Отключить exit on error для plutil
            EXT_PROFILE_UUID=$(echo "$PLUTIL_OUTPUT" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            PLUTIL_UUID_EXIT=$?
            set -e  # Включить обратно
            
            # Проверить что это валидный UUID
            if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "✅ UUID extracted via plutil: $EXT_PROFILE_UUID"
            else
              echo "⚠️  plutil returned invalid UUID: '$EXT_PROFILE_UUID' (exit code: $PLUTIL_UUID_EXIT)"
              EXT_PROFILE_UUID=""
            fi
          else
            echo "⚠️  security cms failed with exit code $PLUTIL_EXIT"
            if [ -n "$PLUTIL_OUTPUT" ]; then
              echo "   Error: $(echo "$PLUTIL_OUTPUT" | head -3)"
            fi
          fi
          
          # Способ 2: через strings (если plutil не сработал)
          if [ -z "$EXT_PROFILE_UUID" ]; then
            echo "  Trying strings method..."
            set +e  # Отключить exit on error
            STRINGS_OUTPUT=$(strings "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            set -e  # Включить обратно
            
            if [ -n "$STRINGS_OUTPUT" ] && [[ "$STRINGS_OUTPUT" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              EXT_PROFILE_UUID="$STRINGS_OUTPUT"
              echo "✅ UUID extracted via strings: $EXT_PROFILE_UUID"
            else
              echo "⚠️  strings method found no valid UUID"
              # Показать первые найденные UUID-подобные строки для диагностики
              set +e
              echo "   Found UUID-like strings:"
              strings "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -3 | sed 's/^/     /' || echo "     (none found)"
              set -e
            fi
          fi
        fi
        
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Переименовать файл в формат UUID.mobileprovision
          mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
          echo "✅ Extension provisioning profile installed with UUID: $EXT_PROFILE_UUID"
          echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> $GITHUB_ENV
        else
          echo "⚠️  Could not extract UUID, keeping default name"
          echo "EXT_PROFILE_PATH=$PROFILE_DIR/extension.mobileprovision" >> $GITHUB_ENV
        fi
        
        # Проверить установленные profiles
        echo ""
        echo "📋 Installed provisioning profiles:"
        ls -la "$PROFILE_DIR"
        
        # Проверить что профили правильно установлены
        echo ""
        echo "📋 Verifying profiles..."
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ App profile found: ${APP_PROFILE_UUID}.mobileprovision"
            # Показать информацию о профиле
            security cms -D -i "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ App profile NOT found: ${APP_PROFILE_UUID}.mobileprovision"
          fi
        fi
        
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ Extension profile found: ${EXT_PROFILE_UUID}.mobileprovision"
            # Показать информацию о профиле
            security cms -D -i "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ Extension profile NOT found: ${EXT_PROFILE_UUID}.mobileprovision"
          fi
        fi
        
        # Проверить что profiles правильные
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          APP_PROFILE_FILE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
          if [ -f "$APP_PROFILE_FILE" ]; then
            echo ""
            echo "📋 Checking app provisioning profile..."
            APP_PROFILE_INFO=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null)
            if [ -n "$APP_PROFILE_INFO" ]; then
              APP_PROFILE_TEAM=$(echo "$APP_PROFILE_INFO" | plutil -extract TeamName raw -o - - 2>/dev/null || echo "")
              APP_PROFILE_BUNDLE=$(echo "$APP_PROFILE_INFO" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
              APP_PROFILE_TYPE=$(echo "$APP_PROFILE_INFO" | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null | head -1 || echo "")
              
              echo "  Team: $APP_PROFILE_TEAM"
              echo "  Bundle ID: $APP_PROFILE_BUNDLE"
              if [ -z "$APP_PROFILE_TYPE" ]; then
                echo "  Type: Distribution (App Store)"
              else
                echo "  Type: Development"
              fi
              
              # Проверить что это не Xcode managed profile
              if echo "$APP_PROFILE_INFO" | grep -q "Xcode Managed" || echo "$APP_PROFILE_INFO" | grep -q "iOS Team"; then
                echo "  ⚠️  WARNING: This appears to be an Xcode managed profile!"
                echo "  ⚠️  Manual signing requires manually managed profiles from developer.apple.com"
              fi
            fi
          fi
        fi
        
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          EXT_PROFILE_FILE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
          if [ -f "$EXT_PROFILE_FILE" ]; then
            echo ""
            echo "📋 Checking extension provisioning profile..."
            EXT_PROFILE_INFO=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null)
            if [ -n "$EXT_PROFILE_INFO" ]; then
              EXT_PROFILE_TEAM=$(echo "$EXT_PROFILE_INFO" | plutil -extract TeamName raw -o - - 2>/dev/null || echo "")
              EXT_PROFILE_BUNDLE=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
              EXT_PROFILE_NETWORK=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements."com.apple.developer.networking.networkextension" raw -o - - 2>/dev/null || echo "")
              EXT_PROFILE_VPN=$(echo "$EXT_PROFILE_INFO" | plutil -extract Entitlements."com.apple.developer.networking.vpn.api" raw -o - - 2>/dev/null || echo "")
              
              echo "  Team: $EXT_PROFILE_TEAM"
              echo "  Bundle ID: $EXT_PROFILE_BUNDLE"
              if [ -n "$EXT_PROFILE_NETWORK" ]; then
                echo "  ✅ Network Extensions: Supported"
              else
                echo "  ❌ Network Extensions: NOT SUPPORTED!"
              fi
              if [ -n "$EXT_PROFILE_VPN" ]; then
                echo "  ✅ VPN API: Supported"
              else
                echo "  ❌ VPN API: NOT SUPPORTED!"
              fi
              
              # Проверить что это не Xcode managed profile
              if echo "$EXT_PROFILE_INFO" | grep -q "Xcode Managed" || echo "$EXT_PROFILE_INFO" | grep -q "iOS Team"; then
                echo "  ⚠️  WARNING: This appears to be an Xcode managed profile!"
                echo "  ⚠️  Manual signing requires manually managed profiles from developer.apple.com"
              fi
              
              # Проверить bundle ID
              if [ "$EXT_PROFILE_BUNDLE" != "family.aladdin.ios.packetTunnel" ]; then
                echo "  ⚠️  WARNING: Bundle ID mismatch! Expected: family.aladdin.ios.packetTunnel, Got: $EXT_PROFILE_BUNDLE"
              fi
            fi
          fi
        fi
        
    - name: Prepare Signing Configuration
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "Preparing signing configuration..."
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          echo "⚠️ Certificate not available, will use Automatic signing"
          exit 0
        fi
        echo "✅ Using manual signing with certificate"
        
    - name: Extract Profile UUIDs
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        if [ -z "$APP_PROFILE_UUID" ] || [[ ! "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            set +e
            APP_PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$APP_PROFILE_UUID" ]; then
              APP_PROFILE_UUID=$(strings "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            fi
            set -e
            if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
              echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV
            fi
          fi
        fi
        if [ -n "${{ secrets.PROVISIONING_PROFILE_EXTENSION }}" ]; then
          if [ -z "$EXT_PROFILE_UUID" ] || [[ ! "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            if [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
              set +e
              EXT_PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
              if [ -z "$EXT_PROFILE_UUID" ]; then
                EXT_PROFILE_UUID=$(strings "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
              fi
              set -e
              if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
                mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
                echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> $GITHUB_ENV
              fi
            fi
          fi
        fi
        
    - name: Get Certificate Name
      env:
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
      run: |
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          exit 0
        fi
        CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "distribution" | head -1)
        if [ -z "$CERT_INFO" ]; then
          echo "❌ No Distribution certificate found!"
          exit 1
        fi
        DIST_CERT_NAME=$(echo "$CERT_INFO" | grep -oE '"Apple Distribution[^"]*"' | sed 's/"//g' || echo "Apple Distribution")
        echo "DIST_CERT_NAME=$DIST_CERT_NAME" >> $GITHUB_ENV
        echo "✅ Certificate: $DIST_CERT_NAME"
        
    - name: Create xcconfig File
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
      run: |
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          echo "⚠️ Skipping xcconfig (using Automatic signing)"
          exit 0
        fi
        mkdir -p ./build
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # Попытаться извлечь UUID из профилей, если они еще не извлечены
        if [ -z "$APP_PROFILE_UUID" ] || [[ ! "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          echo "🔍 Trying to extract APP_PROFILE_UUID from installed profiles..."
          # Ищем профиль по bundle ID или по имени
          if [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            set +e
            APP_PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$APP_PROFILE_UUID" ]; then
              APP_PROFILE_UUID=$(strings "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            fi
            set -e
            if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "✅ Found APP_PROFILE_UUID: $APP_PROFILE_UUID"
              mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" 2>/dev/null || true
            fi
          fi
          # Ищем среди уже переименованных профилей
          if [ -z "$APP_PROFILE_UUID" ] || [[ ! "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              if [ -f "$profile" ]; then
                set +e
                BUNDLE_ID=$(security cms -D -i "$profile" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
                set -e
                if [ "$BUNDLE_ID" = "family.aladdin.ios" ]; then
                  APP_PROFILE_UUID=$(basename "$profile" .mobileprovision)
                  echo "✅ Found app profile by bundle ID: $APP_PROFILE_UUID"
                  break
                fi
              fi
            done
          fi
        fi
        
        if [ -z "$EXT_PROFILE_UUID" ] || [[ ! "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          echo "🔍 Trying to extract EXT_PROFILE_UUID from installed profiles..."
          if [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            set +e
            EXT_PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXT_PROFILE_UUID" ]; then
              EXT_PROFILE_UUID=$(strings "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            fi
            set -e
            if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "✅ Found EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
              mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" 2>/dev/null || true
            fi
          fi
          # Ищем среди уже переименованных профилей
          if [ -z "$EXT_PROFILE_UUID" ] || [[ ! "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              if [ -f "$profile" ]; then
                set +e
                BUNDLE_ID=$(security cms -D -i "$profile" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//' || echo "")
                set -e
                if [ "$BUNDLE_ID" = "family.aladdin.ios.packetTunnel" ]; then
                  EXT_PROFILE_UUID=$(basename "$profile" .mobileprovision)
                  echo "✅ Found extension profile by bundle ID: $EXT_PROFILE_UUID"
                  break
                fi
              fi
            done
          fi
        fi
        
        printf 'CODE_SIGN_STYLE = Manual\n' > ./build/Release.xcconfig
        printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" >> ./build/Release.xcconfig
        printf 'CODE_SIGN_IDENTITY = %s\n' "$DIST_CERT_NAME" >> ./build/Release.xcconfig
        printf 'ALADDIN_CODE_SIGN_STYLE = Manual\n' >> ./build/Release.xcconfig
        printf 'ALADDIN_DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" >> ./build/Release.xcconfig
        printf 'ALADDIN_CODE_SIGN_IDENTITY = %s\n' "$DIST_CERT_NAME" >> ./build/Release.xcconfig
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          printf 'ALADDIN_PROVISIONING_PROFILE_SPECIFIER = %s\n' "$APP_PROFILE_UUID" >> ./build/Release.xcconfig
          echo "✅ Added APP_PROFILE_UUID to xcconfig: $APP_PROFILE_UUID"
        else
          printf 'ALADDIN_PROVISIONING_PROFILE_SPECIFIER = family.aladdin.ios\n' >> ./build/Release.xcconfig
          echo "⚠️  Using bundle ID for app profile (UUID not found)"
        fi
        printf 'ALADDINPacketTunnel_CODE_SIGN_STYLE = Manual\n' >> ./build/Release.xcconfig
        printf 'ALADDINPacketTunnel_DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" >> ./build/Release.xcconfig
        printf 'ALADDINPacketTunnel_CODE_SIGN_IDENTITY = %s\n' "$DIST_CERT_NAME" >> ./build/Release.xcconfig
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          printf 'ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = %s\n' "$EXT_PROFILE_UUID" >> ./build/Release.xcconfig
          echo "✅ Added EXT_PROFILE_UUID to xcconfig: $EXT_PROFILE_UUID"
        else
          printf 'ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = family.aladdin.ios.packetTunnel\n' >> ./build/Release.xcconfig
          echo "⚠️  Using bundle ID for extension profile (UUID not found)"
        fi
        echo "✅ xcconfig created"
        
    - name: Build Archive
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
      run: |
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          APP_PROFILE_PARAMS=""
          if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            APP_PROFILE_PARAMS="ALADDIN_PROVISIONING_PROFILE_SPECIFIER=\"$APP_PROFILE_UUID\""
          fi
          EXT_PROFILE_PARAMS=""
          if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            EXT_PROFILE_PARAMS="ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER=\"$EXT_PROFILE_UUID\""
          fi
          xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -xcconfig ./build/Release.xcconfig \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$DIST_CERT_NAME" \
            ALADDIN_CODE_SIGN_STYLE=Manual \
            $APP_PROFILE_PARAMS \
            ALADDINPacketTunnel_CODE_SIGN_STYLE=Manual \
            $EXT_PROFILE_PARAMS \
            -allowProvisioningUpdates \
            2>&1 | tee /tmp/xcodebuild.log || {
              echo "❌ Build failed"
              tail -50 /tmp/xcodebuild.log
              exit 1
            }
          
          # Проверить что архив создан
          if [ ! -d "./build/ALADDIN.xcarchive" ]; then
            echo "❌ Archive was not created!"
            echo "Checking build directory:"
            ls -la ./build/ 2>&1 || echo "Build directory not found"
            exit 1
          fi
          echo "✅ Archive created successfully: ./build/ALADDIN.xcarchive"
        else
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            xcodebuild archive \
              -project ALADDIN.xcodeproj \
              -scheme ALADDIN \
              -configuration Release \
              -archivePath ./build/ALADDIN.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -allowProvisioningUpdates \
              2>&1 | tee /tmp/xcodebuild.log || {
                echo "❌ Automatic signing failed"
                tail -50 /tmp/xcodebuild.log
                exit 1
              }
          else
            echo "❌ No signing method available!"
            exit 1
          fi
        fi
        
    - name: List Archive Contents
      run: |
        echo "Checking archive..."
        ls -la ./build/ALADDIN.xcarchive/Products/Applications/ 2>&1 || echo "Archive not found or empty"
        
    - name: Export IPA
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        echo "Exporting IPA..."
        
        # Проверить что архив существует
        if [ ! -d "./build/ALADDIN.xcarchive" ]; then
          echo "❌ Archive not found at ./build/ALADDIN.xcarchive"
          echo "Available files in ./build/:"
          ls -la ./build/ 2>&1 || echo "Build directory not found"
          exit 1
        fi
        echo "✅ Archive found: ./build/ALADDIN.xcarchive"
        
        mkdir -p ./build/export
        
        # Использовать UUID профилей из env (уже извлечены в предыдущих шагах)
        # Если UUID не извлечены, используем bundle ID (Xcode найдет профили автоматически)
        if [ -z "$APP_PROFILE_UUID" ] || [[ ! "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          echo "⚠️  APP_PROFILE_UUID not set or invalid, using bundle ID"
          APP_PROFILE_UUID="family.aladdin.ios"
        fi
        if [ -z "$EXT_PROFILE_UUID" ] || [[ ! "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          echo "⚠️  EXT_PROFILE_UUID not set or invalid, using bundle ID"
          EXT_PROFILE_UUID="family.aladdin.ios.packetTunnel"
        fi
        echo "📋 Using APP_PROFILE_UUID: $APP_PROFILE_UUID"
        echo "📋 Using EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
        
        # Определить стиль подписи (Manual - приоритет, так как работает в CI)
        # Если есть сертификат - используем Manual, иначе Automatic (может не работать)
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          SIGNING_STYLE="manual"
          echo "✅ Using Manual signing for export (работает в CI)"
        elif [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
          SIGNING_STYLE="automatic"
          echo "⚠️  Using Automatic signing for export (может не работать в CI)"
        else
          SIGNING_STYLE="manual"
          echo "⚠️  Using Manual signing for export (fallback)"
        fi
        
        # Создать ExportOptions.plist
        if [ "$SIGNING_STYLE" = "automatic" ]; then
          # Automatic signing - Xcode выберет профили автоматически
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>automatic</string>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" > ./build/ExportOptions.plist
        else
          # Manual signing - используем установленные профили
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.packetTunnel</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" > ./build/ExportOptions.plist
        fi
        
        xcodebuild -exportArchive \
          -archivePath ./build/ALADDIN.xcarchive \
          -exportPath ./build/export \
          -exportOptionsPlist ./build/ExportOptions.plist
        
        echo "Checking exported files..."
        ls -la ./build/export/ 2>&1 || echo "Export directory not found"
        
        # Найти .ipa файл
        IPA_FILE=$(find ./build/export -name "*.ipa" | head -1)
        echo "IPA file: $IPA_FILE"
        if [ -z "$IPA_FILE" ]; then
          echo "Error: IPA file not found!"
          exit 1
        fi
        echo "IPA_FILE_PATH=$IPA_FILE" >> $GITHUB_ENV
        
    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      run: |
        if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
          echo "⚠️ App Store Connect API keys not set"
          echo "IPA file will be available as artifact for manual upload"
          echo "IPA file: ${{ env.IPA_FILE_PATH }}"
          exit 0
        fi
        
        # Используем apple-actions для загрузки
        echo "Uploading to App Store Connect..."
        # Создаём временный файл с API ключом
        echo "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey.p8
        chmod 600 /tmp/AuthKey.p8
        
        # Используем fastlane или apple-actions для загрузки
        # Для начала просто проверим, что файл существует
        if [ ! -f "${{ env.IPA_FILE_PATH }}" ]; then
          echo "Error: IPA file not found at ${{ env.IPA_FILE_PATH }}"
          exit 1
        fi
        
        echo "IPA file found: ${{ env.IPA_FILE_PATH }}"
        echo "Ready to upload to App Store Connect"
        
    - name: Upload to App Store Connect using apple-actions
      if: env.APP_STORE_CONNECT_API_KEY != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != ''
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ env.IPA_FILE_PATH }}
        api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always() && env.IPA_FILE_PATH != ''
      with:
        name: ALADDIN-IPA
        path: ${{ env.IPA_FILE_PATH }}
        retention-days: 30
        if-no-files-found: warn
        
    - name: Cleanup Keychain
      if: always() && env.CERTIFICATE_AVAILABLE == 'true'
      run: |
        echo "Cleaning up keychain..."
        if [ -n "${{ env.KEYCHAIN_PATH }}" ] && [ -f "${{ env.KEYCHAIN_PATH }}" ]; then
          security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
          echo "✅ Keychain cleaned up"
        fi
