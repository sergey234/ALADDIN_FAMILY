                  EXT_UUID=$(echo "$PROFILE_XML" | sed -n '/<key>UUID<\/key>/,+2p' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | tr -d '\t ' | head -1 || echo "")
                fi
                if [ -z "$EXT_UUID" ]; then
                  # Метод 5: агрессивный поиск любого UUID в XML
                  EXT_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
                fi
                if [ -n "$EXT_UUID" ] && [[ "$EXT_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
                  echo "✅ UUID extracted via grep: $EXT_UUID"
                else
                  echo "❌ All methods failed to extract UUID"
                  echo "   🔍 Diagnostic: What's after <key>UUID</key>?"
                  echo "$PROFILE_XML" | grep -A 3 '<key>UUID</key>' | head -5
                fi
              fi
            fi
            if [ -n "$EXT_UUID" ] && [[ "$EXT_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_UUID}.mobileprovision"
              echo "✅ Extension profile renamed to: ${EXT_UUID}.mobileprovision"
              echo "EXT_PROFILE_UUID=$EXT_UUID" >> $GITHUB_ENV
              echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXT_UUID}.mobileprovision" >> $GITHUB_ENV
            else
              echo "❌ Failed to extract UUID from extension profile"
              echo "   XML preview (first 500 chars):"
              echo "$PROFILE_XML" | head -c 500
            fi
          else
            echo "❌ Failed to decode extension profile XML (exit code: $SECURITY_EXIT)"
            if [ -n "$PROFILE_XML" ]; then
              echo "   Error output: $PROFILE_XML"
            fi
          fi
          set -e
        fi
        
        echo ""
        echo "📋 Файлы после переименования:"
        ls -la "$PROFILE_DIR" || echo "⚠️  Profile directory not found"
        
    - name: Verify Profiles
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "📋 Installed provisioning profiles:"
        ls -la "$PROFILE_DIR"
        echo ""
        echo "📋 Verifying profiles..."
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ App profile found: ${APP_PROFILE_UUID}.mobileprovision"
            security cms -D -i "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ App profile NOT found: ${APP_PROFILE_UUID}.mobileprovision"
          fi
        fi
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ Extension profile found: ${EXT_PROFILE_UUID}.mobileprovision"
            security cms -D -i "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ Extension profile NOT found: ${EXT_PROFILE_UUID}.mobileprovision"
          fi
        fi
        
    - name: Prepare Profiles for Build
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # КРИТИЧЕСКИ ВАЖНО: Если UUID не извлечен, но файл существует, попытаться извлечь UUID и переименовать файл
        # Xcode требует, чтобы файлы были переименованы в UUID.mobileprovision
        if [ -z "$APP_PROFILE_UUID" ] && [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "🔄 Attempting to extract UUID from app.mobileprovision for renaming..."
          set +e
          PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
            # Попробовать все методы извлечения UUID
            EXTRACTED_UUID=$(echo "$PROFILE_XML" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -A 1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | head -1 || echo "")
            fi
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            fi
            if [ -n "$EXTRACTED_UUID" ] && [[ "$EXTRACTED_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision"
              echo "✅ UUID extracted and file renamed: ${EXTRACTED_UUID}.mobileprovision"
              APP_PROFILE_UUID="$EXTRACTED_UUID"
              echo "APP_PROFILE_UUID=$EXTRACTED_UUID" >> $GITHUB_ENV
              echo "APP_PROFILE_PATH=$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision" >> $GITHUB_ENV
            fi
          fi
          set -e
        fi
        
        if [ -z "$EXT_PROFILE_UUID" ] && [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "🔄 Attempting to extract UUID from extension.mobileprovision for renaming..."
          set +e
          PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
            # Попробовать все методы извлечения UUID
            EXTRACTED_UUID=$(echo "$PROFILE_XML" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -A 1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | head -1 || echo "")
            fi
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
            fi
            if [ -n "$EXTRACTED_UUID" ] && [[ "$EXTRACTED_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision"
              echo "✅ UUID extracted and file renamed: ${EXTRACTED_UUID}.mobileprovision"
              EXT_PROFILE_UUID="$EXTRACTED_UUID"
              echo "EXT_PROFILE_UUID=$EXTRACTED_UUID" >> $GITHUB_ENV
              echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision" >> $GITHUB_ENV
            fi
          fi
          set -e
        fi
        
        # Fallback: Если UUID не извлечен, попытаться найти профили по bundle ID или использовать путь
        if [ -z "$APP_PROFILE_UUID" ]; then
          echo "⚠️  APP_PROFILE_UUID not extracted, trying fallback methods..."
          
          # Метод 1: Попытаться найти профиль по bundle ID
          if [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "🔍 Found app.mobileprovision, attempting to extract UUID again..."
            set +e
            PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null)
            if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
              # Попытаться извлечь UUID из XML
              APP_PROFILE_UUID=$(echo "$PROFILE_XML" | grep -oE '<key>UUID</key>.*?<string>([0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})</string>' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
              if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
                echo "✅ UUID extracted in fallback: $APP_PROFILE_UUID"
              fi
            fi
            set -e
          fi
          
          # Метод 2: Если UUID все еще не найден, использовать bundle ID (Xcode найдет профиль автоматически)
          if [ -z "$APP_PROFILE_UUID" ]; then
            echo "⚠️  Using bundle ID fallback for app profile (Xcode will auto-detect)"
            APP_PROFILE_UUID="family.aladdin.ios"
          fi
        fi
        
        if [ -z "$EXT_PROFILE_UUID" ]; then
          echo "⚠️  EXT_PROFILE_UUID not extracted, trying fallback methods..."
          
          # Метод 1: Попытаться найти профиль по bundle ID
          if [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "🔍 Found extension.mobileprovision, attempting to extract UUID again..."
            set +e
            PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null)
            if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
              # Попытаться извлечь UUID из XML
              EXT_PROFILE_UUID=$(echo "$PROFILE_XML" | grep -oE '<key>UUID</key>.*?<string>([0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})</string>' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || echo "")
              if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
                echo "✅ UUID extracted in fallback: $EXT_PROFILE_UUID"
              fi
            fi
            set -e
          fi
          
          # Метод 2: Если UUID все еще не найден, использовать bundle ID
          if [ -z "$EXT_PROFILE_UUID" ]; then
            echo "⚠️  Using bundle ID fallback for extension profile (Xcode will auto-detect)"
            EXT_PROFILE_UUID="family.aladdin.ios.packetTunnel"
          fi
        fi
        
        # Проверить что у нас есть хотя бы bundle ID для профилей
        if [ -z "$APP_PROFILE_UUID" ] || [ -z "$EXT_PROFILE_UUID" ]; then
          echo "❌ Failed to extract provisioning profile UUIDs or bundle IDs!"
          echo "APP_PROFILE_UUID: $APP_PROFILE_UUID"
          echo "EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
          exit 1
        fi
        
        # Установить пути к профилям (для fallback)
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Это UUID, проверить что файл существует
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            echo "APP_PROFILE_PATH=$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" >> $GITHUB_ENV
          elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "APP_PROFILE_PATH=$PROFILE_DIR/app.mobileprovision" >> $GITHUB_ENV
          fi
        elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "APP_PROFILE_PATH=$PROFILE_DIR/app.mobileprovision" >> $GITHUB_ENV
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Это UUID, проверить что файл существует
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" >> $GITHUB_ENV
          elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "EXT_PROFILE_PATH=$PROFILE_DIR/extension.mobileprovision" >> $GITHUB_ENV
          fi
        elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "EXT_PROFILE_PATH=$PROFILE_DIR/extension.mobileprovision" >> $GITHUB_ENV
        fi
        
        echo "✅ Using profiles:"
        echo "   App: $APP_PROFILE_UUID"
        echo "   Extension: $EXT_PROFILE_UUID"
        echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV
        echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> $GITHUB_ENV
        
    - name: Find Distribution Certificate
      env:
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
      run: |
        export KEYCHAIN_PATH="$KEYCHAIN_PATH"
        export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD"
        
        # Найти правильное имя сертификата Distribution из keychain
        echo "🔍 Finding Distribution certificate in keychain..."
        CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "distribution" | head -1)
        if [ -z "$CERT_INFO" ]; then
          echo "❌ No Distribution certificate found in keychain!"
          exit 1
        fi
        
        # Извлечь полное имя сертификата (включая "Apple Distribution: NAME (ID)")
        # Формат вывода security: "   1) HASH \"Apple Distribution: NAME (ID)\""
        # Извлекаем только имя сертификата из кавычек
        DIST_CERT_NAME=$(echo "$CERT_INFO" | grep -oE '"Apple Distribution[^"]*"' | sed 's/"//g')
        
        # Если не найдено, попробовать другой способ
        if [ -z "$DIST_CERT_NAME" ]; then
          DIST_CERT_NAME=$(echo "$CERT_INFO" | sed -E 's/.*"([^"]*Apple Distribution[^"]*)".*/\1/')
        fi
        
        # Если все еще не найдено, использовать просто "Apple Distribution"
        if [ -z "$DIST_CERT_NAME" ]; then
          DIST_CERT_NAME="Apple Distribution"
        fi
        
        echo "✅ Using certificate: $DIST_CERT_NAME"
        echo "DIST_CERT_NAME=$DIST_CERT_NAME" >> $GITHUB_ENV
        
    - name: Verify Profiles for Build
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # Проверить что профили существуют (с учетом fallback)
        echo "🔍 Проверка профилей перед сборкой..."
        echo "App Profile: $APP_PROFILE_UUID"
        echo "Extension Profile: $EXT_PROFILE_UUID"
        
        # Проверить формат - UUID или bundle ID
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Это UUID - проверяем файл
          APP_PROFILE_FILE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
          if [ ! -f "$APP_PROFILE_FILE" ]; then
            echo "❌ App profile not found: ${APP_PROFILE_UUID}.mobileprovision"
            exit 1
          fi
          echo "✅ App profile found: ${APP_PROFILE_UUID}.mobileprovision"
        else
          # Это bundle ID - проверяем что есть хотя бы один профиль с таким bundle ID
          echo "⚠️  Using bundle ID for app profile: $APP_PROFILE_UUID (Xcode will auto-detect)"
          if [ ! -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "⚠️  app.mobileprovision not found, but Xcode will try to find matching profile"
          fi
          APP_PROFILE_FILE=""
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # Это UUID - проверяем файл
          EXT_PROFILE_FILE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
          if [ ! -f "$EXT_PROFILE_FILE" ]; then
            echo "❌ Extension profile not found: ${EXT_PROFILE_UUID}.mobileprovision"
            exit 1
          fi
          echo "✅ Extension profile found: ${EXT_PROFILE_UUID}.mobileprovision"
        else
          # Это bundle ID - проверяем что есть хотя бы один профиль с таким bundle ID
          echo "⚠️  Using bundle ID for extension profile: $EXT_PROFILE_UUID (Xcode will auto-detect)"
          if [ ! -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "⚠️  extension.mobileprovision not found, but Xcode will try to find matching profile"
          fi
          EXT_PROFILE_FILE=""
        fi
        
        # Проверить содержимое профилей (если файлы найдены)
        if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
          echo "🔍 Проверка содержимого app профиля..."
          APP_PROFILE_NAME=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "")
          echo "App Profile Name: $APP_PROFILE_NAME"
        fi
        
        if [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
          echo "🔍 Проверка содержимого extension профиля..."
          EXT_PROFILE_NAME=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "")
          echo "Extension Profile Name: $EXT_PROFILE_NAME"
        fi
        
        echo "⚠️  Note: If profiles don't match certificate, they need to be regenerated in Developer Portal"
        echo "⚠️  Using -allowProvisioningUpdates to let Xcode try to fix profile issues"
        
        # Проверить capabilities профилей (если файлы найдены)
        APP_PROFILE_TYPE=""
        EXT_PROFILE_TYPE=""
        if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
          echo "🔍 Проверка capabilities app профиля..."
          APP_PROFILE_BUNDLE_ID=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "")
          echo "App Profile Bundle ID: $APP_PROFILE_BUNDLE_ID"
          APP_PROFILE_TYPE=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null || echo "")
          if [ -z "$APP_PROFILE_TYPE" ]; then
            echo "✅ App Profile: App Store Distribution (нет ProvisionedDevices)"
          else
            echo "⚠️  App Profile: Development/Ad Hoc (есть ProvisionedDevices)"
          fi
        fi
        
        if [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
          echo "🔍 Проверка capabilities extension профиля..."
          EXT_PROFILE_BUNDLE_ID=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "")
          echo "Extension Profile Bundle ID: $EXT_PROFILE_BUNDLE_ID"
          EXT_PROFILE_TYPE=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null || echo "")
          if [ -z "$EXT_PROFILE_TYPE" ]; then
            echo "✅ Extension Profile: App Store Distribution (нет ProvisionedDevices)"
          else
            echo "⚠️  Extension Profile: Development/Ad Hoc (есть ProvisionedDevices)"
          fi
          
          # Проверить capabilities для Extension
          EXT_CAPABILITIES=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements raw -o - - 2>/dev/null || echo "")
          if echo "$EXT_CAPABILITIES" | grep -q "com.apple.developer.networking.networkextension"; then
            echo "✅ Extension Profile содержит Network Extensions capability"
          else
            echo "❌ Extension Profile НЕ содержит Network Extensions capability!"
          fi
          if echo "$EXT_CAPABILITIES" | grep -q "com.apple.developer.networking.vpn.api"; then
            echo "✅ Extension Profile содержит Personal VPN capability"
          else
            echo "❌ Extension Profile НЕ содержит Personal VPN capability!"
          fi
        fi
        
        # КРИТИЧЕСКАЯ ПРОВЕРКА: Профили должны быть App Store Distribution
        if [ -n "$APP_PROFILE_TYPE" ] || [ -n "$EXT_PROFILE_TYPE" ]; then
          echo ""
          echo "❌❌❌ КРИТИЧЕСКАЯ ОШИБКА ❌❌❌"
          echo "Профили являются Development/Ad Hoc, а не App Store Distribution!"
          echo "Для App Store нужны профили БЕЗ ProvisionedDevices (App Store Distribution)"
          echo ""
          echo "РЕШЕНИЕ:"
          echo "1. Зайдите в Apple Developer Portal: https://developer.apple.com/account/resources/profiles/list"
          echo "2. Создайте НОВЫЕ профили типа 'App Store' (не Development, не Ad Hoc)"
          echo "3. Для App: Bundle ID 'family.aladdin.ios', тип 'App Store'"
          echo "4. Для Extension: Bundle ID 'family.aladdin.ios.packetTunnel', тип 'App Store'"
          echo "5. Убедитесь, что профили связаны с сертификатом 'Apple Distribution: SERGEY KHLYSTOV'"
          echo "6. Обновите GitHub Secrets: PROVISIONING_PROFILE_APP и PROVISIONING_PROFILE_EXTENSION"
          echo ""
          echo "⚠️  Продолжаем сборку с текущими профилями (может не сработать для App Store)..."
          echo ""
        fi
        
    - name: Create xcconfig for Build
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
      run: |
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # КРИТИЧЕСКАЯ ПРОБЛЕМА: Проект настроен на Automatic signing
        # Xcode игнорирует параметры командной строки, если в проекте установлен Automatic
        # РЕШЕНИЕ: Создать xcconfig файл, который переопределит настройки проекта
        echo "🔧 Создание xcconfig файла для переопределения Automatic signing..."
        mkdir -p ./build
        
        # Определить пути к профилям
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # UUID найден - используем UUID
          APP_PROFILE_SPECIFIER="$APP_PROFILE_UUID"
          APP_PROFILE_VALUE="$APP_PROFILE_UUID"
          echo "✅ Using UUID for app profile: $APP_PROFILE_UUID"
        elif [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
          # UUID не найден, но есть путь к файлу - используем полный путь
          APP_PROFILE_SPECIFIER="$(basename "$APP_PROFILE_PATH" .mobileprovision)"
          APP_PROFILE_VALUE="$APP_PROFILE_PATH"
          echo "⚠️  Using full path for app profile: $APP_PROFILE_PATH"
        elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          # Файл существует, но UUID не извлечен - используем полный путь
          APP_PROFILE_SPECIFIER="app"
          APP_PROFILE_VALUE="$PROFILE_DIR/app.mobileprovision"
          echo "⚠️  Using full path for app profile (UUID not extracted): $APP_PROFILE_VALUE"
        else
          # Fallback на bundle ID
          APP_PROFILE_SPECIFIER="family.aladdin.ios"
          APP_PROFILE_VALUE="family.aladdin.ios"
          echo "⚠️  Using bundle ID fallback for app profile: family.aladdin.ios"
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
          # UUID найден - используем UUID
          EXT_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
          EXT_PROFILE_VALUE="$EXT_PROFILE_UUID"
          echo "✅ Using UUID for extension profile: $EXT_PROFILE_UUID"
        elif [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
          # UUID не найден, но есть путь к файлу - используем полный путь
          EXT_PROFILE_SPECIFIER="$(basename "$EXT_PROFILE_PATH" .mobileprovision)"
          EXT_PROFILE_VALUE="$EXT_PROFILE_PATH"
          echo "⚠️  Using full path for extension profile: $EXT_PROFILE_PATH"
        elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          # Файл существует, но UUID не извлечен - используем полный путь
          EXT_PROFILE_SPECIFIER="extension"
          EXT_PROFILE_VALUE="$PROFILE_DIR/extension.mobileprovision"
          echo "⚠️  Using full path for extension profile (UUID not extracted): $EXT_PROFILE_VALUE"
        else
          # Fallback на bundle ID
          EXT_PROFILE_SPECIFIER="family.aladdin.ios.packetTunnel"
          EXT_PROFILE_VALUE="family.aladdin.ios.packetTunnel"
          echo "⚠️  Using bundle ID fallback for extension profile: family.aladdin.ios.packetTunnel"
        fi
        
        # Создать xcconfig файл
        {
          echo "// Override Automatic signing with Manual signing for CI"
          echo "CODE_SIGN_STYLE = Manual"
          echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          echo "CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
          echo ""
          echo "// App target"
          echo "ALADDIN_CODE_SIGN_STYLE = Manual"
          echo "ALADDIN_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          echo "ALADDIN_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
          if [[ "$APP_PROFILE_VALUE" =~ ^/ ]]; then
            # Это полный путь - используем его напрямую
            echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_VALUE"
            echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
          elif [[ "$APP_PROFILE_VALUE" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # Это UUID
            echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_VALUE"
            echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_VALUE"
          else
            # Это bundle ID - используем полный путь если доступен
            if [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
              echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_PATH"
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
            else
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
            fi
          fi
          echo ""
          echo "// Extension target"
          echo "ALADDINPacketTunnel_CODE_SIGN_STYLE = Manual"
          echo "ALADDINPacketTunnel_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          echo "ALADDINPacketTunnel_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
          if [[ "$EXT_PROFILE_VALUE" =~ ^/ ]]; then
            # Это полный путь - используем его напрямую
            echo "ALADDINPacketTunnel_PROVISIONING_PROFILE = $EXT_PROFILE_VALUE"
            echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
          elif [[ "$EXT_PROFILE_VALUE" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # Это UUID
            echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_VALUE"
            echo "ALADDINPacketTunnel_PROVISIONING_PROFILE = $EXT_PROFILE_VALUE"
          else
            # Это bundle ID - используем полный путь если доступен
            if [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE = $EXT_PROFILE_PATH"
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
            else
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
            fi
          fi
        } > ./build/Release.xcconfig
        echo "✅ xcconfig файл создан"
        echo "📋 Contents:"
        cat ./build/Release.xcconfig
        
    - name: Build Archive (with signing)
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
      run: |
        echo "Building archive with manual signing..."
        echo "Team ID: $APPLE_TEAM_ID"
        echo "Bundle ID: family.aladdin.ios"
        echo "App Profile UUID: $APP_PROFILE_UUID"
        echo "Extension Profile UUID: $EXT_PROFILE_UUID"
        echo "App Profile Path: $APP_PROFILE_PATH"
        echo "Extension Profile Path: $EXT_PROFILE_PATH"
        
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        
        # ПРИОРИТЕТ 1: Manual signing (работает в CI, если есть сертификат и профили)
        # ВАЖНО: Automatic signing НЕ работает в CI из-за "No Accounts" ошибки
        # Поэтому используем Manual signing как основной способ
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          echo "✅ Using manual signing with certificate"
          
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          
          # Проверить что профили установлены
          echo "🔍 Проверка установленных профилей..."
          ls -la "$PROFILE_DIR" || echo "⚠️  Profile directory not found"
          
          # Определить пути к профилям
          if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            APP_PROFILE_FILE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
          elif [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
            APP_PROFILE_FILE="$APP_PROFILE_PATH"
          else
            APP_PROFILE_FILE="$PROFILE_DIR/app.mobileprovision"
          fi
          
          if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            EXT_PROFILE_FILE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
          elif [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
            EXT_PROFILE_FILE="$EXT_PROFILE_PATH"
          else
            EXT_PROFILE_FILE="$PROFILE_DIR/extension.mobileprovision"
          fi
          
          # Проверить что файлы существуют (или использовать bundle ID fallback)
          if [ ! -f "$APP_PROFILE_FILE" ]; then
            if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              # Это UUID, но файл не найден - ошибка
              echo "❌ App profile not found: $APP_PROFILE_FILE"
              echo "Available profiles:"
              ls -la "$PROFILE_DIR" || true
              exit 1
            else
              # Это bundle ID - Xcode найдет профиль автоматически
              echo "⚠️  App profile file not found, but using bundle ID: $APP_PROFILE_UUID (Xcode will auto-detect)"
              APP_PROFILE_FILE=""
            fi
          else
            echo "✅ App profile found: $APP_PROFILE_FILE"
          fi
          
          if [ ! -f "$EXT_PROFILE_FILE" ]; then
            if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              # Это UUID, но файл не найден - ошибка
              echo "❌ Extension profile not found: $EXT_PROFILE_FILE"
              echo "Available profiles:"
              ls -la "$PROFILE_DIR" || true
              echo ""
              echo "❌❌❌ КРИТИЧЕСКАЯ ОШИБКА ❌❌❌"
              echo "Extension profile не найден! Секрет PROVISIONING_PROFILE_EXTENSION не установлен или неверен!"
              echo ""
              echo "РЕШЕНИЕ:"
              echo "1. Зайдите в Apple Developer Portal: https://developer.apple.com/account/resources/profiles/list"
              echo "2. Создайте или скачайте App Store Distribution профиль для Extension"
              echo "3. Bundle ID должен быть: family.aladdin.ios.packetTunnel"
              echo "4. Профиль должен содержать Network Extensions и Personal VPN capabilities"
              echo "5. Закодируйте профиль в base64: cat profile.mobileprovision | base64"
              echo "6. Добавьте в GitHub Secrets: PROVISIONING_PROFILE_EXTENSION"
              exit 1
            else
              # Это bundle ID - Xcode найдет профиль автоматически
              echo "⚠️  Extension profile file not found, but using bundle ID: $EXT_PROFILE_UUID (Xcode will auto-detect)"
              EXT_PROFILE_FILE=""
            fi
          else
            echo "✅ Extension profile found: $EXT_PROFILE_FILE"
          fi
          
          # Установить keychain для использования в xcodebuild
          export KEYCHAIN_PATH="$KEYCHAIN_PATH"
          export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD"
          
          echo "✅ Используем Manual signing с установленными профилями"
          echo "Team ID: $APPLE_TEAM_ID"
          echo "Certificate: $DIST_CERT_NAME"
          echo "App Profile: $APP_PROFILE_UUID (file: $APP_PROFILE_FILE)"
          echo "Extension Profile: $EXT_PROFILE_UUID (file: $EXT_PROFILE_FILE)"
          
          # Используем Manual signing с xcconfig файлом
          # ВАЖНО: xcconfig переопределит настройки проекта (Automatic → Manual)
          echo "🔍 Запуск xcodebuild archive с Manual signing через xcconfig..."
          echo "Используем xcconfig файл для переопределения Automatic signing"
          
          # Построить команду xcodebuild с правильными параметрами
          XCODEBUILD_CMD="xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -xcconfig ./build/Release.xcconfig \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=\"$APPLE_TEAM_ID\" \
            CODE_SIGN_IDENTITY=\"$DIST_CERT_NAME\" \
            ALADDIN_CODE_SIGN_STYLE=Manual \
            ALADDIN_PROVISIONING_PROFILE_SPECIFIER=\"$APP_PROFILE_UUID\" \
            ALADDINPacketTunnel_CODE_SIGN_STYLE=Manual \
            ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER=\"$EXT_PROFILE_UUID\" \
            -allowProvisioningUpdates"
          
          # КРИТИЧЕСКИ ВАЖНО: Добавить PROVISIONING_PROFILE только если это UUID (не bundle ID)
          # Xcode НЕ МОЖЕТ использовать bundle ID в PROVISIONING_PROFILE в CI
          # Нужен ТОЛЬКО UUID или полный путь к файлу
          
          # Для App Profile
          if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # UUID найден - используем UUID
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDIN_PROVISIONING_PROFILE=\"$APP_PROFILE_UUID\""
            echo "✅ Using UUID for ALADDIN_PROVISIONING_PROFILE: $APP_PROFILE_UUID"
          elif [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
            # UUID не найден, но есть файл - используем полный путь
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDIN_PROVISIONING_PROFILE=\"$APP_PROFILE_FILE\""
            echo "⚠️  Using full path for ALADDIN_PROVISIONING_PROFILE: $APP_PROFILE_FILE"
          else
            echo "⚠️  No UUID or file for app profile, Xcode will try to find by bundle ID"
          fi
          
          # Для Extension Profile
          if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # UUID найден - используем UUID
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDINPacketTunnel_PROVISIONING_PROFILE=\"$EXT_PROFILE_UUID\""
            echo "✅ Using UUID for ALADDINPacketTunnel_PROVISIONING_PROFILE: $EXT_PROFILE_UUID"
          elif [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
            # UUID не найден, но есть файл - используем полный путь
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDINPacketTunnel_PROVISIONING_PROFILE=\"$EXT_PROFILE_FILE\""
            echo "⚠️  Using full path for ALADDINPacketTunnel_PROVISIONING_PROFILE: $EXT_PROFILE_FILE"
          else
            echo "⚠️  No UUID or file for extension profile, Xcode will try to find by bundle ID"
          fi
          
          # Выполнить команду
          eval $XCODEBUILD_CMD 2>&1 | tee /tmp/xcodebuild.log || {
            echo "❌ xcodebuild archive failed with exit code $?"
            echo "Последние 50 строк лога:"
            tail -50 /tmp/xcodebuild.log
            echo ""
            echo "🔍 Проверка установленных профилей:"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
            echo ""
            echo "🔍 Содержимое профилей:"
            if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
              echo "App profile bundle ID:"
              security cms -D -i "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
              echo "App profile (app.mobileprovision) bundle ID:"
              security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            fi
            if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
              echo "Extension profile bundle ID:"
              security cms -D -i "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
              echo "Extension profile (extension.mobileprovision) bundle ID:"
              security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            fi
            exit 1
          }
          
          # КРИТИЧЕСКАЯ ПРОВЕРКА: Профили должны быть App Store Distribution
          if [ -n "$APP_PROFILE_TYPE" ] || [ -n "$EXT_PROFILE_TYPE" ]; then
            echo ""
            echo "❌❌❌ КРИТИЧЕСКАЯ ОШИБКА ❌❌❌"
            echo "Профили являются Development/Ad Hoc, а не App Store Distribution!"
            echo "Для App Store нужны профили БЕЗ ProvisionedDevices (App Store Distribution)"
            echo ""
            echo "РЕШЕНИЕ:"
            echo "1. Зайдите в Apple Developer Portal: https://developer.apple.com/account/resources/profiles/list"
            echo "2. Создайте НОВЫЕ профили типа 'App Store' (не Development, не Ad Hoc)"
            echo "3. Для App: Bundle ID 'family.aladdin.ios', тип 'App Store'"
            echo "4. Для Extension: Bundle ID 'family.aladdin.ios.packetTunnel', тип 'App Store'"
            echo "5. Убедитесь, что профили связаны с сертификатом 'Apple Distribution: SERGEY KHLYSTOV'"
            echo "6. Обновите GitHub Secrets: PROVISIONING_PROFILE_APP и PROVISIONING_PROFILE_EXTENSION"
            echo ""
            echo "⚠️  Продолжаем сборку с текущими профилями (может не сработать для App Store)..."
            echo ""
          fi
          
          # КРИТИЧЕСКАЯ ПРОБЛЕМА: Проект настроен на Automatic signing
          # Xcode игнорирует параметры командной строки, если в проекте установлен Automatic
          # РЕШЕНИЕ: Создать xcconfig файл, который переопределит настройки проекта
          echo "🔧 Создание xcconfig файла для переопределения Automatic signing..."
          mkdir -p ./build
          
          # Определить параметры профилей (UUID или bundle ID)
          APP_PROFILE_SPECIFIER="$APP_PROFILE_UUID"
          EXT_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
          
          # Если это bundle ID, Xcode найдет профиль автоматически по bundle ID
          {
            echo "// Override Automatic signing with Manual signing for CI"
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
            echo ""
            echo "// App target"
            echo "ALADDIN_CODE_SIGN_STYLE = Manual"
            echo "ALADDIN_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "ALADDIN_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
            if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_UUID"
              echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_UUID"
            else
              echo "// Using bundle ID: $APP_PROFILE_UUID (Xcode will auto-detect)"
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_UUID"
            fi
            echo ""
            echo "// Extension target"
            echo "ALADDINPacketTunnel_CODE_SIGN_STYLE = Manual"
            echo "ALADDINPacketTunnel_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "ALADDINPacketTunnel_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
            if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_UUID"
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE = $EXT_PROFILE_UUID"
            else
              echo "// Using bundle ID: $EXT_PROFILE_UUID (Xcode will auto-detect)"
              echo "ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_UUID"
            fi
          } > ./build/Release.xcconfig
          echo "✅ xcconfig файл создан"
          
          # Используем Manual signing с xcconfig файлом
          # ВАЖНО: xcconfig переопределит настройки проекта (Automatic → Manual)
          echo "🔍 Запуск xcodebuild archive с Manual signing через xcconfig..."
          echo "Используем xcconfig файл для переопределения Automatic signing"
          
          # Построить команду xcodebuild с правильными параметрами
          XCODEBUILD_CMD="xcodebuild archive \
            -project ALADDIN.xcodeproj \
            -scheme ALADDIN \
            -configuration Release \
            -xcconfig ./build/Release.xcconfig \
            -archivePath ./build/ALADDIN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=\"$APPLE_TEAM_ID\" \
            CODE_SIGN_IDENTITY=\"$DIST_CERT_NAME\" \
            ALADDIN_CODE_SIGN_STYLE=Manual \
            ALADDIN_PROVISIONING_PROFILE_SPECIFIER=\"$APP_PROFILE_UUID\" \
            ALADDINPacketTunnel_CODE_SIGN_STYLE=Manual \
            ALADDINPacketTunnel_PROVISIONING_PROFILE_SPECIFIER=\"$EXT_PROFILE_UUID\" \
            -allowProvisioningUpdates"
          
          # КРИТИЧЕСКИ ВАЖНО: Добавить PROVISIONING_PROFILE только если это UUID (не bundle ID)
          # Xcode НЕ МОЖЕТ использовать bundle ID в PROVISIONING_PROFILE в CI
          # Нужен ТОЛЬКО UUID или полный путь к файлу
          
          # Для App Profile
          if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # UUID найден - используем UUID
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDIN_PROVISIONING_PROFILE=\"$APP_PROFILE_UUID\""
            echo "✅ Using UUID for ALADDIN_PROVISIONING_PROFILE: $APP_PROFILE_UUID"
          elif [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
            # UUID не найден, но есть файл - используем полный путь
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDIN_PROVISIONING_PROFILE=\"$APP_PROFILE_FILE\""
            echo "⚠️  Using full path for ALADDIN_PROVISIONING_PROFILE: $APP_PROFILE_FILE"
          else
            echo "⚠️  No UUID or file for app profile, Xcode will try to find by bundle ID"
          fi
          
          # Для Extension Profile
          if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]]; then
            # UUID найден - используем UUID
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDINPacketTunnel_PROVISIONING_PROFILE=\"$EXT_PROFILE_UUID\""
            echo "✅ Using UUID for ALADDINPacketTunnel_PROVISIONING_PROFILE: $EXT_PROFILE_UUID"
          elif [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
            # UUID не найден, но есть файл - используем полный путь
            XCODEBUILD_CMD="$XCODEBUILD_CMD ALADDINPacketTunnel_PROVISIONING_PROFILE=\"$EXT_PROFILE_FILE\""
            echo "⚠️  Using full path for ALADDINPacketTunnel_PROVISIONING_PROFILE: $EXT_PROFILE_FILE"
          else
            echo "⚠️  No UUID or file for extension profile, Xcode will try to find by bundle ID"
          fi
          
          # Выполнить команду
          eval $XCODEBUILD_CMD 2>&1 | tee /tmp/xcodebuild.log || {
            echo "❌ xcodebuild archive failed with exit code $?"
            echo "Последние 50 строк лога:"
            tail -50 /tmp/xcodebuild.log
            echo ""
            echo "🔍 Проверка установленных профилей:"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
            echo ""
            echo "🔍 Содержимое профилей:"
            if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
              echo "App profile bundle ID:"
              security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
              echo "App profile (app.mobileprovision) bundle ID:"
              security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            fi
            if [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
              echo "Extension profile bundle ID:"
              security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
              echo "Extension profile (extension.mobileprovision) bundle ID:"
              security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "Не удалось извлечь"
            fi
            exit 1
          }
        # ПРИОРИТЕТ 2: Automatic signing (только если нет сертификата)
        # ВАЖНО: Automatic signing может не работать в CI из-за "No Accounts"
        else
          echo "⚠️  Certificate not available"
          echo "⚠️  Пробуем Automatic signing (может не работать в CI из-за 'No Accounts')"
          
          # Проверить наличие API ключей
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "✅ App Store Connect API keys found, trying Automatic signing"
            
            # Настроить API ключи для Xcode
            mkdir -p ~/.appstoreconnect/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            
            xcodebuild archive \
              -project ALADDIN.xcodeproj \
              -scheme ALADDIN \
              -configuration Release \
              -archivePath ./build/ALADDIN.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -allowProvisioningUpdates \
              2>&1 | tee /tmp/xcodebuild.log || {
                echo "❌ Automatic signing failed (ожидаемо в CI)"
                echo "Последние 50 строк лога:"
                tail -50 /tmp/xcodebuild.log
                echo ""
                echo "❌ РЕШЕНИЕ: Добавьте сертификат в GitHub Secrets:"
                echo "  - IOS_DISTRIBUTION_CERTIFICATE"
                echo "  - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
                exit 1
              }
          else
            echo "❌ App Store Connect API keys not set!"
            echo "❌ И сертификат отсутствует!"
            echo ""
            echo "Добавьте ОДИН из вариантов:"
            echo "1. Сертификат (рекомендуется для CI):"
            echo "   - IOS_DISTRIBUTION_CERTIFICATE"
            echo "   - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
            echo ""
            echo "2. Или API ключи (может не работать в CI):"
            echo "   - APP_STORE_CONNECT_API_KEY"
            echo "   - APP_STORE_CONNECT_ISSUER_ID"
            echo "   - APP_STORE_CONNECT_API_KEY_ID"
            exit 1
          fi
        fi
        
    - name: List Archive Contents
      run: |
        echo "Checking archive..."
        ls -la ./build/ALADDIN.xcarchive/Products/Applications/ 2>&1 || echo "Archive not found or empty"
        
    - name: Export IPA
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Exporting IPA..."
        mkdir -p ./build/export
        
        # Извлечь UUID профилей для ExportOptions
        APP_PROFILE_UUID="${{ env.APP_PROFILE_UUID }}"
        EXT_PROFILE_UUID="${{ env.EXT_PROFILE_UUID }}"
        
        # Если UUID не извлечены, используем bundle ID (Xcode найдет профили автоматически)
        if [ -z "$APP_PROFILE_UUID" ]; then
          APP_PROFILE_UUID="family.aladdin.ios"
        fi
        if [ -z "$EXT_PROFILE_UUID" ]; then
          EXT_PROFILE_UUID="family.aladdin.ios.packetTunnel"
        fi
        
        # Определить стиль подписи (Manual - приоритет, так как работает в CI)
        # Если есть сертификат - используем Manual, иначе Automatic (может не работать)
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          SIGNING_STYLE="manual"
          echo "✅ Using Manual signing for export (работает в CI)"
        elif [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
          SIGNING_STYLE="automatic"
          echo "⚠️  Using Automatic signing for export (может не работать в CI)"
        else
          SIGNING_STYLE="manual"
          echo "⚠️  Using Manual signing for export (fallback)"
        fi
        
        # Создать ExportOptions.plist
        if [ "$SIGNING_STYLE" = "automatic" ]; then
          # Automatic signing - Xcode выберет профили автоматически
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>automatic</string>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" > ./build/ExportOptions.plist
        else
          # Manual signing - используем установленные профили
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.packetTunnel</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" > ./build/ExportOptions.plist
        fi
        
        xcodebuild -exportArchive \
          -archivePath ./build/ALADDIN.xcarchive \
          -exportPath ./build/export \
          -exportOptionsPlist ./build/ExportOptions.plist
        
        echo "Checking exported files..."
        ls -la ./build/export/ 2>&1 || echo "Export directory not found"
        
        # Найти .ipa файл
        IPA_FILE=$(find ./build/export -name "*.ipa" | head -1)
        echo "IPA file: $IPA_FILE"
        if [ -z "$IPA_FILE" ]; then
          echo "Error: IPA file not found!"
          exit 1
        fi
        echo "IPA_FILE_PATH=$IPA_FILE" >> $GITHUB_ENV
        
    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      run: |
        if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
          echo "⚠️ App Store Connect API keys not set"
          echo "IPA file will be available as artifact for manual upload"
          echo "IPA file: ${{ env.IPA_FILE_PATH }}"
          exit 0
        fi
        
        # Используем apple-actions для загрузки
        echo "Uploading to App Store Connect..."
        # Создаём временный файл с API ключом
        echo "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey.p8
        chmod 600 /tmp/AuthKey.p8
        
        # Используем fastlane или apple-actions для загрузки
        # Для начала просто проверим, что файл существует
        if [ ! -f "${{ env.IPA_FILE_PATH }}" ]; then
          echo "Error: IPA file not found at ${{ env.IPA_FILE_PATH }}"
          exit 1
        fi
        
        echo "IPA file found: ${{ env.IPA_FILE_PATH }}"
        echo "Ready to upload to App Store Connect"
        
    - name: Upload to App Store Connect using apple-actions
      if: env.APP_STORE_CONNECT_API_KEY != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' && env.APP_STORE_CONNECT_API_KEY_ID != ''
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ env.IPA_FILE_PATH }}
        api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always() && env.IPA_FILE_PATH != ''
      with:
        name: ALADDIN-IPA
        path: ${{ env.IPA_FILE_PATH }}
        retention-days: 30
        if-no-files-found: warn
        
    - name: Cleanup Keychain
      if: always() && env.CERTIFICATE_AVAILABLE == 'true'
      run: |
        echo "Cleaning up keychain..."
        if [ -n "${{ env.KEYCHAIN_PATH }}" ] && [ -f "${{ env.KEYCHAIN_PATH }}" ]; then
          security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
          echo "✅ Keychain cleaned up"
        fi
