name: Check Secrets

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/check-secrets.yml'

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check APP_STORE_CONNECT_API_KEY
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            echo "❌ APP_STORE_CONNECT_API_KEY is not set"
            exit 1
          else
            echo "✅ APP_STORE_CONNECT_API_KEY is set"
            KEY_LENGTH=$(echo '${{ secrets.APP_STORE_CONNECT_API_KEY }}' | wc -c)
            echo "Length: $KEY_LENGTH characters"
            if echo '${{ secrets.APP_STORE_CONNECT_API_KEY }}' | grep -q "BEGIN PRIVATE KEY"; then
              echo "✅ Format looks correct (contains BEGIN PRIVATE KEY)"
            else
              echo "⚠️ Warning: Format might be incorrect"
            fi
          fi
      
      - name: Check APP_STORE_CONNECT_ISSUER_ID
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ]; then
            echo "❌ APP_STORE_CONNECT_ISSUER_ID is not set"
            exit 1
          else
            echo "✅ APP_STORE_CONNECT_ISSUER_ID is set"
            echo "Value: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
            if echo '${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}' | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
              echo "✅ Format looks correct (UUID)"
            else
              echo "⚠️ Warning: Format might be incorrect (should be UUID)"
            fi
          fi
      
      - name: Check APP_STORE_CONNECT_API_KEY_ID
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "❌ APP_STORE_CONNECT_API_KEY_ID is not set"
            exit 1
          else
            echo "✅ APP_STORE_CONNECT_API_KEY_ID is set"
            echo "Value: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          fi
      
      - name: Check APPLE_TEAM_ID
        run: |
          if [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "⚠️ APPLE_TEAM_ID is not set (optional, but recommended)"
          else
            echo "✅ APPLE_TEAM_ID is set"
            echo "Value: ${{ secrets.APPLE_TEAM_ID }}"
          fi
      
      - name: Summary
        run: |
          echo ""
          echo "📋 SUMMARY:"
          echo "==========="
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "✅ All required secrets are set!"
            echo "✅ You can use 'Build and Upload to App Store' workflow"
          else
            echo "❌ Some required secrets are missing"
            echo "❌ Please add missing secrets to GitHub"
          fi

