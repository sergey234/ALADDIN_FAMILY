            fi
            if [ -z "$GREP_UUID" ]; then
              # Метод 5: агрессивный поиск UUID в XML (любой UUID)
              GREP_UUID=$(echo "$PLUTIL_OUTPUT" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
            fi
            if [ -n "$GREP_UUID" ] && [[ "$GREP_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              EXT_PROFILE_UUID="$GREP_UUID"
              echo "✅ UUID extracted via grep: $EXT_PROFILE_UUID"
            else
              echo "⚠️  grep methods failed to extract UUID"
              echo "   Searching for UUID pattern in XML..."
              echo "$PLUTIL_OUTPUT" | grep -i uuid | head -3 || echo "   No UUID found in XML"
            fi
          fi
        fi
        
        # Метод 3: Через strings (последний резерв)
        if [ -z "$EXT_PROFILE_UUID" ]; then
          set +e
          echo "🔍 Trying strings method to extract UUID..."
          STRINGS_OUTPUT=$(strings "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
          set -e
          if [ -n "$STRINGS_OUTPUT" ] && [[ "$STRINGS_OUTPUT" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            EXT_PROFILE_UUID="$STRINGS_OUTPUT"
            echo "✅ UUID extracted via strings: $EXT_PROFILE_UUID"
          else
            echo "⚠️  strings method failed to extract UUID"
