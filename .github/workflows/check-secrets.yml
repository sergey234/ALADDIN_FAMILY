        fi
        
        # КРИТИЧЕСКИ ВАЖНО: Извлечь UUID из extension.mobileprovision и переименовать
        if [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "🔄 Извлечение UUID из extension.mobileprovision..."
          set +e
          # Метод 1: security cms + plutil
          PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>&1)
          SECURITY_EXIT=$?
          if [ $SECURITY_EXIT -eq 0 ] && [ -n "$PROFILE_XML" ]; then
            echo "✅ Extension profile XML decoded successfully"
            echo "   XML length: $(echo -n "$PROFILE_XML" | wc -c | tr -d ' ') characters"
            EXT_UUID=$(echo "$PROFILE_XML" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -n "$EXT_UUID" ] && [[ "$EXT_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              echo "✅ UUID extracted via plutil: $EXT_UUID"
            else
              EXT_UUID=""
              echo "⚠️  plutil failed, trying awk..."
              # Метод 2: awk (РАБОТАЕТ! Находит UUID в диагностике)
        EXT_UUID=$(echo "$PROFILE_XML" | awk '/<key>UUID<\/key>/{getline; if(/<string>/){gsub(/.*<string>|<\/string>.*/,""); print; exit}}' | tr -d '\t ' || echo "")
        echo "   🔍 Debug: EXT_UUID after extraction: '$EXT_UUID'"
        echo "   🔍 Debug: EXT_UUID length: $(echo -n "$EXT_UUID" | wc -c | tr -d ' ')"
        if [ -n "$EXT_UUID" ]; then
          echo "   🔍 Debug: EXT_UUID is not empty, checking regex..."
          if [[ "$EXT_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "✅ UUID extracted via awk: $EXT_UUID"
          else
            echo "   ⚠️  EXT_UUID doesn't match regex pattern"
            echo "   🔍 Debug: EXT_UUID value: '$EXT_UUID'"
            EXT_UUID=""
            echo "⚠️  awk failed, trying grep..."
          fi
        else
          EXT_UUID=""
          echo "⚠️  awk failed (empty result), trying grep..."
                # Метод 3: grep в XML с обработкой табов
                EXT_UUID=$(echo "$PROFILE_XML" | grep -A 2 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | tr -d '\t ' | head -1 || echo "")
                if [ -z "$EXT_UUID" ]; then
                  # Метод 4: sed для поиска UUID в следующей строке
                  EXT_UUID=$(echo "$PROFILE_XML" | sed -n '/<key>UUID<\/key>/,+2p' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | tr -d '\t ' | head -1 || echo "")
                fi
                if [ -z "$EXT_UUID" ]; then
                  # Метод 5: агрессивный поиск любого UUID в XML
                  EXT_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
                fi
                if [ -n "$EXT_UUID" ] && [[ "$EXT_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                  echo "✅ UUID extracted via grep: $EXT_UUID"
                else
                  echo "❌ All methods failed to extract UUID"
                  echo "   🔍 Diagnostic: What's after <key>UUID</key>?"
                  echo "$PROFILE_XML" | grep -A 3 '<key>UUID</key>' | head -5
                fi
              fi
            fi
            if [ -n "$EXT_UUID" ] && [[ "$EXT_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_UUID}.mobileprovision"
              echo "✅ Extension profile renamed to: ${EXT_UUID}.mobileprovision"
              echo "EXT_PROFILE_UUID=$EXT_UUID" >> $GITHUB_ENV
              echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXT_UUID}.mobileprovision" >> $GITHUB_ENV
            else
              echo "❌ Failed to extract UUID from extension profile"
              echo "   XML preview (first 500 chars):"
              echo "$PROFILE_XML" | head -c 500
            fi
          else
            echo "❌ Failed to decode extension profile XML (exit code: $SECURITY_EXIT)"
            if [ -n "$PROFILE_XML" ]; then
              echo "   Error output: $PROFILE_XML"
            fi
          fi
          set -e
        fi
        
        echo ""
        echo "📋 Файлы после переименования:"
        ls -la "$PROFILE_DIR" || echo "⚠️  Profile directory not found"
        
    - name: Verify Profiles
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "📋 Installed provisioning profiles:"
        ls -la "$PROFILE_DIR"
        echo ""
        echo "📋 Verifying profiles..."
        if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ App profile found: ${APP_PROFILE_UUID}.mobileprovision"
            security cms -D -i "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ App profile NOT found: ${APP_PROFILE_UUID}.mobileprovision"
          fi
        fi
        if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            echo "✅ Extension profile found: ${EXT_PROFILE_UUID}.mobileprovision"
            security cms -D -i "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "  Name: (could not extract)"
          else
            echo "❌ Extension profile NOT found: ${EXT_PROFILE_UUID}.mobileprovision"
          fi
        fi
        
    - name: Prepare Profiles for Build
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # КРИТИЧЕСКИ ВАЖНО: Если UUID не извлечен, но файл существует, попытаться извлечь UUID и переименовать файл
        # Xcode требует, чтобы файлы были переименованы в UUID.mobileprovision
        if [ -z "$APP_PROFILE_UUID" ] && [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "🔄 Attempting to extract UUID from app.mobileprovision for renaming..."
          set +e
          PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
            # Попробовать все методы извлечения UUID
            EXTRACTED_UUID=$(echo "$PROFILE_XML" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -A 1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | head -1 || echo "")
            fi
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
            fi
            if [ -n "$EXTRACTED_UUID" ] && [[ "$EXTRACTED_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision"
              echo "✅ UUID extracted and file renamed: ${EXTRACTED_UUID}.mobileprovision"
              APP_PROFILE_UUID="$EXTRACTED_UUID"
              echo "APP_PROFILE_UUID=$EXTRACTED_UUID" >> $GITHUB_ENV
              echo "APP_PROFILE_PATH=$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision" >> $GITHUB_ENV
            fi
          fi
          set -e
        fi
        
        if [ -z "$EXT_PROFILE_UUID" ] && [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "🔄 Attempting to extract UUID from extension.mobileprovision for renaming..."
          set +e
          PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
            # Попробовать все методы извлечения UUID
            EXTRACTED_UUID=$(echo "$PROFILE_XML" | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -A 1 '<key>UUID</key>' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | head -1 || echo "")
            fi
            if [ -z "$EXTRACTED_UUID" ]; then
              EXTRACTED_UUID=$(echo "$PROFILE_XML" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
            fi
            if [ -n "$EXTRACTED_UUID" ] && [[ "$EXTRACTED_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision"
              echo "✅ UUID extracted and file renamed: ${EXTRACTED_UUID}.mobileprovision"
              EXT_PROFILE_UUID="$EXTRACTED_UUID"
              echo "EXT_PROFILE_UUID=$EXTRACTED_UUID" >> $GITHUB_ENV
              echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXTRACTED_UUID}.mobileprovision" >> $GITHUB_ENV
            fi
          fi
          set -e
        fi
        
        # Fallback: Если UUID не извлечен, попытаться найти профили по bundle ID или использовать путь
        if [ -z "$APP_PROFILE_UUID" ]; then
          echo "⚠️  APP_PROFILE_UUID not extracted, trying fallback methods..."
          
          # Метод 1: Попытаться найти профиль по bundle ID
          if [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "🔍 Found app.mobileprovision, attempting to extract UUID again..."
            set +e
            PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" 2>/dev/null)
            if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
              # Попытаться извлечь UUID из XML
              APP_PROFILE_UUID=$(echo "$PROFILE_XML" | grep -oE '<key>UUID</key>.*?<string>([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})</string>' | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
              if [ -n "$APP_PROFILE_UUID" ] && [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                mv "$PROFILE_DIR/app.mobileprovision" "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
                echo "✅ UUID extracted in fallback: $APP_PROFILE_UUID"
              fi
            fi
            set -e
          fi
          
          # Метод 2: Если UUID все еще не найден, использовать bundle ID (Xcode найдет профиль автоматически)
          if [ -z "$APP_PROFILE_UUID" ]; then
            echo "⚠️  Using bundle ID fallback for app profile (Xcode will auto-detect)"
            APP_PROFILE_UUID="family.aladdin.ios"
          fi
        fi
        
        if [ -z "$EXT_PROFILE_UUID" ]; then
          echo "⚠️  EXT_PROFILE_UUID not extracted, trying fallback methods..."
          
          # Метод 1: Попытаться найти профиль по bundle ID
          if [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "🔍 Found extension.mobileprovision, attempting to extract UUID again..."
            set +e
            PROFILE_XML=$(security cms -D -i "$PROFILE_DIR/extension.mobileprovision" 2>/dev/null)
            if [ $? -eq 0 ] && [ -n "$PROFILE_XML" ]; then
              # Попытаться извлечь UUID из XML
              EXT_PROFILE_UUID=$(echo "$PROFILE_XML" | grep -oE '<key>UUID</key>.*?<string>([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})</string>' | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
              if [ -n "$EXT_PROFILE_UUID" ] && [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                mv "$PROFILE_DIR/extension.mobileprovision" "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
                echo "✅ UUID extracted in fallback: $EXT_PROFILE_UUID"
              fi
            fi
            set -e
          fi
          
          # Метод 2: Если UUID все еще не найден, использовать bundle ID
          if [ -z "$EXT_PROFILE_UUID" ]; then
            echo "⚠️  Using bundle ID fallback for extension profile (Xcode will auto-detect)"
            EXT_PROFILE_UUID="family.aladdin.ios.ALADDINContentBlocker"
          fi
        fi
        
        # Проверить что у нас есть хотя бы bundle ID для профилей
          if [ -z "$APP_PROFILE_UUID" ] || [ -z "$EXT_PROFILE_UUID" ]; then
          echo "❌ Failed to extract provisioning profile UUIDs or bundle IDs!"
            echo "APP_PROFILE_UUID: $APP_PROFILE_UUID"
            echo "EXT_PROFILE_UUID: $EXT_PROFILE_UUID"
            exit 1
          fi
          
        # Установить пути к профилям (для fallback)
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # Это UUID, проверить что файл существует
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            echo "APP_PROFILE_PATH=$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" >> $GITHUB_ENV
          elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "APP_PROFILE_PATH=$PROFILE_DIR/app.mobileprovision" >> $GITHUB_ENV
          fi
        elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          echo "APP_PROFILE_PATH=$PROFILE_DIR/app.mobileprovision" >> $GITHUB_ENV
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # Это UUID, проверить что файл существует
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            echo "EXT_PROFILE_PATH=$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" >> $GITHUB_ENV
          elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "EXT_PROFILE_PATH=$PROFILE_DIR/extension.mobileprovision" >> $GITHUB_ENV
          fi
        elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          echo "EXT_PROFILE_PATH=$PROFILE_DIR/extension.mobileprovision" >> $GITHUB_ENV
        fi
        
        echo "✅ Using profiles:"
        echo "   App: $APP_PROFILE_UUID"
        echo "   Extension: $EXT_PROFILE_UUID"
        echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV
        echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> $GITHUB_ENV
        
    - name: Find Distribution Certificate
      env:
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
      run: |
        export KEYCHAIN_PATH="$KEYCHAIN_PATH"
        export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD"
          
          # Найти правильное имя сертификата Distribution из keychain
          echo "🔍 Finding Distribution certificate in keychain..."
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "distribution" | head -1)
          if [ -z "$CERT_INFO" ]; then
            echo "❌ No Distribution certificate found in keychain!"
            exit 1
          fi
          
          # Извлечь полное имя сертификата (включая "Apple Distribution: NAME (ID)")
          # Формат вывода security: "   1) HASH \"Apple Distribution: NAME (ID)\""
          # Извлекаем только имя сертификата из кавычек
          DIST_CERT_NAME=$(echo "$CERT_INFO" | grep -oE '"Apple Distribution[^"]*"' | sed 's/"//g')
          
          # Если не найдено, попробовать другой способ
          if [ -z "$DIST_CERT_NAME" ]; then
            DIST_CERT_NAME=$(echo "$CERT_INFO" | sed -E 's/.*"([^"]*Apple Distribution[^"]*)".*/\1/')
          fi
          
          # Если все еще не найдено, использовать просто "Apple Distribution"
          if [ -z "$DIST_CERT_NAME" ]; then
            DIST_CERT_NAME="Apple Distribution"
          fi
          
          echo "✅ Using certificate: $DIST_CERT_NAME"
        echo "DIST_CERT_NAME=$DIST_CERT_NAME" >> $GITHUB_ENV
        
    - name: Verify Profiles for Build
      env:
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
      run: |
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
        # Проверить что профили существуют (с учетом fallback)
          echo "🔍 Проверка профилей перед сборкой..."
        echo "App Profile: $APP_PROFILE_UUID"
        echo "Extension Profile: $EXT_PROFILE_UUID"
        
        # Проверить формат - UUID или bundle ID
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # Это UUID - проверяем файл
          APP_PROFILE_FILE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
          if [ ! -f "$APP_PROFILE_FILE" ]; then
            echo "❌ App profile not found: ${APP_PROFILE_UUID}.mobileprovision"
            exit 1
          fi
          echo "✅ App profile found: ${APP_PROFILE_UUID}.mobileprovision"
        else
          # Это bundle ID - проверяем что есть хотя бы один профиль с таким bundle ID
          echo "⚠️  Using bundle ID for app profile: $APP_PROFILE_UUID (Xcode will auto-detect)"
          if [ ! -f "$PROFILE_DIR/app.mobileprovision" ]; then
            echo "⚠️  app.mobileprovision not found, but Xcode will try to find matching profile"
          fi
          APP_PROFILE_FILE=""
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # Это UUID - проверяем файл
          EXT_PROFILE_FILE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
          if [ ! -f "$EXT_PROFILE_FILE" ]; then
            echo "❌ Extension profile not found: ${EXT_PROFILE_UUID}.mobileprovision"
            exit 1
          fi
          echo "✅ Extension profile found: ${EXT_PROFILE_UUID}.mobileprovision"
        else
          # Это bundle ID - проверяем что есть хотя бы один профиль с таким bundle ID
          echo "⚠️  Using bundle ID for extension profile: $EXT_PROFILE_UUID (Xcode will auto-detect)"
          if [ ! -f "$PROFILE_DIR/extension.mobileprovision" ]; then
            echo "⚠️  extension.mobileprovision not found, but Xcode will try to find matching profile"
          fi
          EXT_PROFILE_FILE=""
        fi
        
        # Проверить содержимое профилей (если файлы найдены)
        if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
          echo "🔍 Проверка содержимого app профиля..."
          APP_PROFILE_NAME=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "")
          echo "App Profile Name: $APP_PROFILE_NAME"
        fi
        
        if [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
          echo "🔍 Проверка содержимого extension профиля..."
          EXT_PROFILE_NAME=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || echo "")
          echo "Extension Profile Name: $EXT_PROFILE_NAME"
        fi
        
        echo "⚠️  Note: If profiles don't match certificate, they need to be regenerated in Developer Portal"
        echo "⚠️  Using -allowProvisioningUpdates to let Xcode try to fix profile issues"
        
        # Проверить capabilities профилей (если файлы найдены)
        APP_PROFILE_TYPE=""
        EXT_PROFILE_TYPE=""
        if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
          echo "🔍 Проверка capabilities app профиля..."
          APP_PROFILE_BUNDLE_ID=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "")
            echo "App Profile Bundle ID: $APP_PROFILE_BUNDLE_ID"
          APP_PROFILE_TYPE=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null || echo "")
            if [ -z "$APP_PROFILE_TYPE" ]; then
              echo "✅ App Profile: App Store Distribution (нет ProvisionedDevices)"
            else
              echo "⚠️  App Profile: Development/Ad Hoc (есть ProvisionedDevices)"
            fi
          fi
          
        if [ -n "$EXT_PROFILE_FILE" ] && [ -f "$EXT_PROFILE_FILE" ]; then
          echo "🔍 Проверка capabilities extension профиля..."
          EXT_PROFILE_BUNDLE_ID=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "")
            echo "Extension Profile Bundle ID: $EXT_PROFILE_BUNDLE_ID"
          EXT_PROFILE_TYPE=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null | plutil -extract ProvisionedDevices raw -o - - 2>/dev/null || echo "")
            if [ -z "$EXT_PROFILE_TYPE" ]; then
              echo "✅ Extension Profile: App Store Distribution (нет ProvisionedDevices)"
            else
              echo "⚠️  Extension Profile: Development/Ad Hoc (есть ProvisionedDevices)"
            fi
            
            REQUIRED_APP_GROUP="group.com.aladdin.family"
            # Проверяем App Group в extension-профиле (критично для Content Blocker)
            security cms -D -i "$EXT_PROFILE_FILE" > /tmp/ext_profile_verify.plist 2>/dev/null
            EXT_APP_GROUPS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" /tmp/ext_profile_verify.plist 2>/dev/null || echo "")
            if echo "$EXT_APP_GROUPS" | grep -q "$REQUIRED_APP_GROUP"; then
              echo "✅ Extension Profile содержит App Group: $REQUIRED_APP_GROUP"
            else
              echo "❌ Extension Profile НЕ содержит App Group: $REQUIRED_APP_GROUP"
              echo "❌ Xcode archive гарантированно упадет с entitlements mismatch"
              echo "❌ Пересоздайте profile 'ALADDINContentBlocker App Store Distribution' c App Groups и обновите secret PROVISIONING_PROFILE_EXTENSION"
              echo "⚠️  Продолжаем сборку, чтобы получить полный лог Fastlane."
            fi
          fi

          # Проверяем App Group в app-профиле (тоже критично)
          if [ -n "$APP_PROFILE_FILE" ] && [ -f "$APP_PROFILE_FILE" ]; then
            REQUIRED_APP_GROUP="group.com.aladdin.family"
            security cms -D -i "$APP_PROFILE_FILE" > /tmp/app_profile_verify.plist 2>/dev/null
            APP_APP_GROUPS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" /tmp/app_profile_verify.plist 2>/dev/null || echo "")
            if echo "$APP_APP_GROUPS" | grep -q "$REQUIRED_APP_GROUP"; then
              echo "✅ App Profile содержит App Group: $REQUIRED_APP_GROUP"
            else
              echo "❌ App Profile НЕ содержит App Group: $REQUIRED_APP_GROUP"
              echo "❌ Xcode archive гарантированно упадет с entitlements mismatch"
              echo "❌ Пересоздайте profile 'ALADDIN App Store Distribution' c App Groups и обновите secret PROVISIONING_PROFILE_APP"
              echo "⚠️  Продолжаем сборку, чтобы получить полный лог Fastlane."
            fi
          fi
          
          # КРИТИЧЕСКАЯ ПРОВЕРКА: Профили должны быть App Store Distribution
          if [ -n "$APP_PROFILE_TYPE" ] || [ -n "$EXT_PROFILE_TYPE" ]; then
            echo ""
            echo "❌❌❌ КРИТИЧЕСКАЯ ОШИБКА ❌❌❌"
            echo "Профили являются Development/Ad Hoc, а не App Store Distribution!"
            echo "Для App Store нужны профили БЕЗ ProvisionedDevices (App Store Distribution)"
            echo ""
            echo "РЕШЕНИЕ:"
            echo "1. Зайдите в Apple Developer Portal: https://developer.apple.com/account/resources/profiles/list"
            echo "2. Создайте НОВЫЕ профили типа 'App Store' (не Development, не Ad Hoc)"
            echo "3. Для App: Bundle ID 'family.aladdin.ios', тип 'App Store'"
            echo "4. Для Extension: Bundle ID 'family.aladdin.ios.ALADDINContentBlocker', тип 'App Store'"
            echo "5. Убедитесь, что профили связаны с сертификатом 'Apple Distribution: SERGEY KHLYSTOV'"
            echo "6. Обновите GitHub Secrets: PROVISIONING_PROFILE_APP и PROVISIONING_PROFILE_EXTENSION"
            echo ""
            echo "⚠️  Продолжаем сборку с текущими профилями (может не сработать для App Store)..."
            echo ""
          fi
          
    - name: Decode Antifake Share Profile (optional)
      if: env.ANTIFAKE_SHARE_EXISTS == 'true'
      env:
        PROVISIONING_PROFILE_ANTIFAKE_SHARE: ${{ secrets.PROVISIONING_PROFILE_ANTIFAKE_SHARE }}
      run: |
        chmod +x scripts/decode_antifake_share_profile_ci.sh
        bash scripts/decode_antifake_share_profile_ci.sh

    - name: Decode Call Directory Profile (optional)
      if: env.CALL_DIRECTORY_EXISTS == 'true'
      env:
        PROVISIONING_PROFILE_CALL_DIRECTORY: ${{ secrets.PROVISIONING_PROFILE_CALL_DIRECTORY }}
      run: |
        chmod +x scripts/decode_call_directory_profile_ci.sh
        bash scripts/decode_call_directory_profile_ci.sh

    - name: Create xcconfig for Build
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        ANTIFAKE_PROFILE_UUID: ${{ env.ANTIFAKE_PROFILE_UUID }}
        CALL_DIRECTORY_PROFILE_UUID: ${{ env.CALL_DIRECTORY_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
      run: |
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        
          # КРИТИЧЕСКАЯ ПРОБЛЕМА: Проект настроен на Automatic signing
          # Xcode игнорирует параметры командной строки, если в проекте установлен Automatic
          # РЕШЕНИЕ: Создать xcconfig файл, который переопределит настройки проекта
          echo "🔧 Создание xcconfig файла для переопределения Automatic signing..."
          mkdir -p ./build
        
        # Определить пути к профилям
        # КРИТИЧЕСКИ ВАЖНО: Приоритет - полный путь к файлу (более надежно в CI)
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        if [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
          # Полный путь к файлу доступен - используем его (приоритет)
          APP_PROFILE_SPECIFIER="$APP_PROFILE_UUID"
          APP_PROFILE_VALUE="$APP_PROFILE_PATH"
          echo "✅ Using full path for app profile: $APP_PROFILE_PATH"
        elif [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # UUID найден - проверяем, существует ли файл с таким UUID
          if [ -f "$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision" ]; then
            APP_PROFILE_SPECIFIER="$APP_PROFILE_UUID"
            APP_PROFILE_VALUE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
            echo "✅ Using UUID file path for app profile: $APP_PROFILE_VALUE"
          else
            # UUID найден, но файл не найден - используем UUID
            APP_PROFILE_SPECIFIER="$APP_PROFILE_UUID"
            APP_PROFILE_VALUE="$APP_PROFILE_UUID"
            echo "⚠️  Using UUID for app profile: $APP_PROFILE_UUID (file not found)"
          fi
        elif [ -f "$PROFILE_DIR/app.mobileprovision" ]; then
          # Файл существует, но UUID не извлечен - используем полный путь
          APP_PROFILE_SPECIFIER="app"
          APP_PROFILE_VALUE="$PROFILE_DIR/app.mobileprovision"
          echo "⚠️  Using full path for app profile (UUID not extracted): $APP_PROFILE_VALUE"
        else
          # Fallback на bundle ID
          APP_PROFILE_SPECIFIER="family.aladdin.ios"
          APP_PROFILE_VALUE="family.aladdin.ios"
          echo "⚠️  Using bundle ID fallback for app profile: family.aladdin.ios"
        fi
        
        if [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
          # Полный путь к файлу доступен - используем его (приоритет)
          EXT_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
          EXT_PROFILE_VALUE="$EXT_PROFILE_PATH"
          echo "✅ Using full path for extension profile: $EXT_PROFILE_PATH"
        elif [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          # UUID найден - проверяем, существует ли файл с таким UUID
          if [ -f "$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision" ]; then
            EXT_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
            EXT_PROFILE_VALUE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
            echo "✅ Using UUID file path for extension profile: $EXT_PROFILE_VALUE"
          else
            # UUID найден, но файл не найден - используем UUID
            EXT_PROFILE_SPECIFIER="$EXT_PROFILE_UUID"
            EXT_PROFILE_VALUE="$EXT_PROFILE_UUID"
            echo "⚠️  Using UUID for extension profile: $EXT_PROFILE_UUID (file not found)"
          fi
        elif [ -f "$PROFILE_DIR/extension.mobileprovision" ]; then
          # Файл существует, но UUID не извлечен - используем полный путь
          EXT_PROFILE_SPECIFIER="extension"
          EXT_PROFILE_VALUE="$PROFILE_DIR/extension.mobileprovision"
          echo "⚠️  Using full path for extension profile (UUID not extracted): $EXT_PROFILE_VALUE"
        else
          # Fallback на bundle ID
          EXT_PROFILE_SPECIFIER="family.aladdin.ios.ALADDINContentBlocker"
          EXT_PROFILE_VALUE="family.aladdin.ios.ALADDINContentBlocker"
          echo "⚠️  Using bundle ID fallback for extension profile: family.aladdin.ios.ALADDINContentBlocker"
        fi
        
        # Создать xcconfig файл
          {
            echo "// Per-target signing overrides for CI (no global CODE_SIGN_STYLE)"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
            echo ""
            echo "// App target"
            echo "ALADDIN_CODE_SIGN_STYLE = Manual"
            echo "ALADDIN_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "ALADDIN_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
          echo "ALADDIN_PRODUCT_BUNDLE_IDENTIFIER = family.aladdin.ios"
          if [[ "$APP_PROFILE_VALUE" =~ ^/ ]]; then
            # Это полный путь - используем его напрямую
            echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_VALUE"
            echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
          elif [[ "$APP_PROFILE_VALUE" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            # Это UUID
            echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_VALUE"
            echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_VALUE"
          else
            # Это bundle ID - используем полный путь если доступен
            if [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
              echo "ALADDIN_PROVISIONING_PROFILE = $APP_PROFILE_PATH"
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
            else
              echo "ALADDIN_PROVISIONING_PROFILE_SPECIFIER = $APP_PROFILE_SPECIFIER"
            fi
          fi
            echo ""
            # Extension target (только если существует)
            if [ "${{ env.EXTENSION_EXISTS }}" = "true" ]; then
              echo "// Extension target"
              echo "ALADDINContentBlocker_CODE_SIGN_STYLE = Manual"
              echo "ALADDINContentBlocker_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
              echo "ALADDINContentBlocker_CODE_SIGN_IDENTITY = $DIST_CERT_NAME"
              echo "ALADDINContentBlocker_PRODUCT_BUNDLE_IDENTIFIER = family.aladdin.ios.ALADDINContentBlocker"
              if [[ "$EXT_PROFILE_VALUE" =~ ^/ ]]; then
                # Это полный путь - используем его напрямую
                echo "ALADDINContentBlocker_PROVISIONING_PROFILE = $EXT_PROFILE_VALUE"
                echo "ALADDINContentBlocker_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
              elif [[ "$EXT_PROFILE_VALUE" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
                # Это UUID
                echo "ALADDINContentBlocker_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_VALUE"
                echo "ALADDINContentBlocker_PROVISIONING_PROFILE = $EXT_PROFILE_VALUE"
              else
                # Это bundle ID - используем полный путь если доступен
                if [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
                  echo "ALADDINContentBlocker_PROVISIONING_PROFILE = $EXT_PROFILE_PATH"
                  echo "ALADDINContentBlocker_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
                else
                  echo "ALADDINContentBlocker_PROVISIONING_PROFILE_SPECIFIER = $EXT_PROFILE_SPECIFIER"
                fi
              fi
            else
              echo "// Extension target removed - no configuration needed"
            fi
            if [ "${{ env.ANTIFAKE_SHARE_EXISTS }}" = "true" ]; then
              echo ""
              echo "// Antifake Share extension (build 227+)"
              if [ -n "$ANTIFAKE_PROFILE_UUID" ]; then
                echo "ALADDINAntifakeShare_CODE_SIGN_IDENTITY = Apple Distribution"
                echo "ALADDINAntifakeShare_CODE_SIGN_STYLE = Manual"
                echo "ALADDINAntifakeShare_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
                echo "ALADDINAntifakeShare_PROVISIONING_PROFILE_SPECIFIER = $ANTIFAKE_PROFILE_UUID"
                echo "ALADDINAntifakeShare_PROVISIONING_PROFILE = $ANTIFAKE_PROFILE_UUID"
              else
                echo "ALADDINAntifakeShare_CODE_SIGN_STYLE = Automatic"
                echo "ALADDINAntifakeShare_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
                echo "ALADDINAntifakeShare_PROVISIONING_PROFILE_SPECIFIER ="
              fi
              echo "ALADDINAntifakeShare_PRODUCT_BUNDLE_IDENTIFIER = family.aladdin.ios.ALADDINAntifakeShare"
            fi
            if [ "${{ env.CALL_DIRECTORY_EXISTS }}" = "true" ]; then
              echo ""
              echo "// Call Directory extension (build 232+)"
              if [ -n "$CALL_DIRECTORY_PROFILE_UUID" ]; then
                echo "ALADDINCallDirectory_CODE_SIGN_IDENTITY = Apple Distribution"
                echo "ALADDINCallDirectory_CODE_SIGN_STYLE = Manual"
                echo "ALADDINCallDirectory_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
                echo "ALADDINCallDirectory_PROVISIONING_PROFILE_SPECIFIER = $CALL_DIRECTORY_PROFILE_UUID"
                echo "ALADDINCallDirectory_PROVISIONING_PROFILE = $CALL_DIRECTORY_PROFILE_UUID"
              else
                echo "ALADDINCallDirectory_CODE_SIGN_STYLE = Automatic"
                echo "ALADDINCallDirectory_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
                echo "ALADDINCallDirectory_PROVISIONING_PROFILE_SPECIFIER ="
              fi
              echo "ALADDINCallDirectory_PRODUCT_BUNDLE_IDENTIFIER = family.aladdin.ios.ALADDINCallDirectory"
            fi
          } > ./build/Release.xcconfig
          echo "✅ xcconfig файл создан"
        echo "📋 Contents:"
        cat ./build/Release.xcconfig
        
    - name: Prepare Build Environment
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APP_PROFILE_PATH: ${{ env.APP_PROFILE_PATH }}
        EXT_PROFILE_PATH: ${{ env.EXT_PROFILE_PATH }}
      run: |
        echo "Building archive with manual signing..."
        echo "Team ID: $APPLE_TEAM_ID"
        echo "Bundle ID: family.aladdin.ios"
        echo "App Profile UUID: $APP_PROFILE_UUID"
        echo "Extension Profile UUID: $EXT_PROFILE_UUID"
        echo "App Profile Path: $APP_PROFILE_PATH"
        echo "Extension Profile Path: $EXT_PROFILE_PATH"
        
        if [ -z "$APPLE_TEAM_ID" ]; then
          echo "❌ APPLE_TEAM_ID secret is not set!"
          exit 1
        fi
        
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          echo "⚠️  Certificate not available, skipping manual signing preparation"
          exit 0
        fi
        
        echo "✅ Using manual signing with certificate"
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "🔍 Проверка установленных профилей..."
        ls -la "$PROFILE_DIR" || echo "⚠️  Profile directory not found"
        
        # Определить пути к профилям
        if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          APP_PROFILE_FILE="$PROFILE_DIR/${APP_PROFILE_UUID}.mobileprovision"
        elif [ -n "$APP_PROFILE_PATH" ] && [ -f "$APP_PROFILE_PATH" ]; then
          APP_PROFILE_FILE="$APP_PROFILE_PATH"
        else
          APP_PROFILE_FILE="$PROFILE_DIR/app.mobileprovision"
        fi
        
        if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
          EXT_PROFILE_FILE="$PROFILE_DIR/${EXT_PROFILE_UUID}.mobileprovision"
        elif [ -n "$EXT_PROFILE_PATH" ] && [ -f "$EXT_PROFILE_PATH" ]; then
          EXT_PROFILE_FILE="$EXT_PROFILE_PATH"
        else
          EXT_PROFILE_FILE="$PROFILE_DIR/extension.mobileprovision"
        fi
        
        # Проверить что файлы существуют
        if [ ! -f "$APP_PROFILE_FILE" ]; then
          if [[ "$APP_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "❌ App profile not found: $APP_PROFILE_FILE"
            ls -la "$PROFILE_DIR" || true
            exit 1
          else
            echo "⚠️  App profile file not found, but using bundle ID: $APP_PROFILE_UUID"
            APP_PROFILE_FILE=""
          fi
        else
          echo "✅ App profile found: $APP_PROFILE_FILE"
        fi
        
        if [ ! -f "$EXT_PROFILE_FILE" ]; then
          if [[ "$EXT_PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "❌ Extension profile not found: $EXT_PROFILE_FILE"
            ls -la "$PROFILE_DIR" || true
            exit 1
          else
            echo "⚠️  Extension profile file not found, but using bundle ID: $EXT_PROFILE_UUID"
            EXT_PROFILE_FILE=""
          fi
        else
          echo "✅ Extension profile found: $EXT_PROFILE_FILE"
        fi
        
        # Сохранить пути в переменные окружения для следующих шагов
        echo "APP_PROFILE_FILE=$APP_PROFILE_FILE" >> $GITHUB_ENV
        echo "EXT_PROFILE_FILE=$EXT_PROFILE_FILE" >> $GITHUB_ENV
        
    - name: Diagnose Profiles and Certificates
      env:
        APP_PROFILE_FILE: ${{ env.APP_PROFILE_FILE }}
        EXT_PROFILE_FILE: ${{ env.EXT_PROFILE_FILE }}
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          exit 0
        fi
        
        echo "✅ Используем Manual signing с установленными профилями"
        echo "Team ID: $APPLE_TEAM_ID"
        echo "Certificate: $DIST_CERT_NAME"
        echo "App Profile: $APP_PROFILE_UUID (file: $APP_PROFILE_FILE)"
        echo "Extension Profile: $EXT_PROFILE_UUID (file: $EXT_PROFILE_FILE)"
        
        # Проверить профили
        if [ -f "$APP_PROFILE_FILE" ]; then
          echo "📋 App Profile:"
          APP_PROFILE_XML=$(security cms -D -i "$APP_PROFILE_FILE" 2>/dev/null)
          if [ -n "$APP_PROFILE_XML" ]; then
            APP_PROFILE_NAME=$(echo "$APP_PROFILE_XML" | plutil -extract Name raw -o - - 2>/dev/null || echo "unknown")
            APP_PROFILE_BUNDLE_ID=$(echo "$APP_PROFILE_XML" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "unknown")
            echo "   Name: $APP_PROFILE_NAME"
            echo "   Bundle ID: $APP_PROFILE_BUNDLE_ID"
          fi
        fi
        
        if [ -f "$EXT_PROFILE_FILE" ]; then
          echo "📋 Extension Profile:"
          EXT_PROFILE_XML=$(security cms -D -i "$EXT_PROFILE_FILE" 2>/dev/null)
          if [ -n "$EXT_PROFILE_XML" ]; then
            EXT_PROFILE_NAME=$(echo "$EXT_PROFILE_XML" | plutil -extract Name raw -o - - 2>/dev/null || echo "unknown")
            EXT_PROFILE_BUNDLE_ID=$(echo "$EXT_PROFILE_XML" | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || echo "unknown")
            echo "   Name: $EXT_PROFILE_NAME"
            echo "   Bundle ID: $EXT_PROFILE_BUNDLE_ID"
          fi
        fi
        
        # Проверить сертификаты
        echo "📋 Сертификаты в keychain:"
        KEYCHAIN_CERTS=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -i "distribution" || echo "")
        if [ -n "$KEYCHAIN_CERTS" ]; then
          echo "$KEYCHAIN_CERTS"
          KEYCHAIN_CERT_HASH=$(echo "$KEYCHAIN_CERTS" | awk '{print $2}' | head -1)
          echo "   Fingerprint (SHA-1): $KEYCHAIN_CERT_HASH"
        fi
        
    - name: Build Archive with Fastlane
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PROFILE_UUID: ${{ env.APP_PROFILE_UUID }}
        EXT_PROFILE_UUID: ${{ env.EXT_PROFILE_UUID }}
        DIST_CERT_NAME: ${{ env.DIST_CERT_NAME }}
        KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
      run: |
        set -o pipefail
        BUILD_LOG_PATH="/tmp/aladdin-build.log"

        print_first_build_errors() {
          if [ -f "$BUILD_LOG_PATH" ]; then
            echo "🔎 First build errors from log:"
            grep -En "error:|\\*\\* BUILD FAILED \\*\\*|The following build commands failed" "$BUILD_LOG_PATH" | head -n 40 || true
            echo ""
            echo "🧾 Log tail:"
            tail -50 "$BUILD_LOG_PATH" || true
          fi
        }

        if [ "${{ env.CERTIFICATE_AVAILABLE }}" != "true" ]; then
          echo "⚠️  Certificate not available"
          echo "⚠️  Пробуем Automatic signing (может не работать в CI)"
          
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "✅ App Store Connect API keys found, trying Automatic signing"
            mkdir -p ~/.appstoreconnect/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            
            xcodebuild archive \
              -project ALADDIN.xcodeproj \
              -scheme ALADDIN \
              -configuration Release \
              -archivePath ./build/ALADDIN.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -allowProvisioningUpdates \
              2>&1 | tee "$BUILD_LOG_PATH" || {
                echo "❌ Automatic signing failed"
                print_first_build_errors
                exit 1
              }
          else
            echo "❌ App Store Connect API keys not set!"
            exit 1
          fi
          exit 0
        fi
        
        echo "🚀 Запуск Fastlane для сборки архива..."
        export APPLE_TEAM_ID="$APPLE_TEAM_ID"
        export KEYCHAIN_PATH="$KEYCHAIN_PATH"
        export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD"
        export APP_PROFILE_UUID="$APP_PROFILE_UUID"
        export PROVISIONING_PROFILE_EXTENSION_UUID="$EXT_PROFILE_UUID"
        export EXT_PROFILE_UUID="$EXT_PROFILE_UUID"
        export PROVISIONING_PROFILE_ANTIFAKE_SHARE_UUID="${{ env.ANTIFAKE_PROFILE_UUID }}"
        export PROVISIONING_PROFILE_CALL_DIRECTORY_UUID="${{ env.CALL_DIRECTORY_PROFILE_UUID }}"
        export DIST_CERT_NAME="$DIST_CERT_NAME"

        if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
           [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
           [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
          mkdir -p ~/.appstoreconnect/private_keys
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          export APP_STORE_CONNECT_API_KEY_ID="${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          export APP_STORE_CONNECT_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          export APP_STORE_CONNECT_API_KEY_PATH="$ASC_KEY_PATH"
          echo "✅ Exported App Store Connect API env for -allowProvisioningUpdates"
        fi
        
        fastlane ios build_archive 2>&1 | tee "$BUILD_LOG_PATH" || {
          echo "❌ Fastlane build_archive failed"
          print_first_build_errors
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          exit 1
        }
        
    - name: List Archive Contents
      run: |
        echo "Checking archive..."
        ls -la ./build/ALADDIN.xcarchive/Products/Applications/ 2>&1 || echo "Archive not found or empty"
        
    - name: Export IPA
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Exporting IPA..."
        mkdir -p ./build/export
        
        # Извлечь UUID профилей для ExportOptions
        APP_PROFILE_UUID="${{ env.APP_PROFILE_UUID }}"
        EXT_PROFILE_UUID="${{ env.EXT_PROFILE_UUID }}"
        ANTIFAKE_PROFILE_UUID="${{ env.ANTIFAKE_PROFILE_UUID }}"
        
        CALL_DIRECTORY_PROFILE_UUID="${{ env.CALL_DIRECTORY_PROFILE_UUID }}"
        
        if [ "${{ env.CALL_DIRECTORY_EXISTS }}" = "true" ] && [ -z "$CALL_DIRECTORY_PROFILE_UUID" ]; then
          CALL_DIRECTORY_PROFILE_UUID="family.aladdin.ios.ALADDINCallDirectory"
        fi
        
        # Если UUID не извлечены, используем bundle ID (Xcode найдет профили автоматически)
        if [ -z "$APP_PROFILE_UUID" ]; then
          APP_PROFILE_UUID="family.aladdin.ios"
        fi
        # Extension UUID только если target существует
        if [ "${{ env.EXTENSION_EXISTS }}" = "true" ]; then
          if [ -z "$EXT_PROFILE_UUID" ]; then
            EXT_PROFILE_UUID="family.aladdin.ios.ALADDINContentBlocker"
          fi
        else
          EXT_PROFILE_UUID=""
          echo "✅ Extension target removed - will not include extension in ExportOptions.plist"
        fi
        
        # Определить стиль подписи (Manual - приоритет, так как работает в CI)
        # Если есть сертификат - используем Manual, иначе Automatic (может не работать)
        if [ "${{ env.CERTIFICATE_AVAILABLE }}" = "true" ]; then
          SIGNING_STYLE="manual"
          echo "✅ Using Manual signing for export (работает в CI)"
        elif [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
          SIGNING_STYLE="automatic"
          echo "⚠️  Using Automatic signing for export (может не работать в CI)"
        else
          SIGNING_STYLE="manual"
          echo "⚠️  Using Manual signing for export (fallback)"
        fi
        
        # Создать ExportOptions.plist
        if [ "$SIGNING_STYLE" = "automatic" ]; then
          # Automatic signing - Xcode выберет профили автоматически
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>automatic</string>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" > ./build/ExportOptions.plist
        else
          # Manual signing - используем установленные профили
          if [ "${{ env.EXTENSION_EXISTS }}" = "true" ] && [ -n "$EXT_PROFILE_UUID" ]; then
            if [ "${{ env.ANTIFAKE_SHARE_EXISTS }}" = "true" ] && [ -n "$ANTIFAKE_PROFILE_UUID" ]; then
              if [ "${{ env.CALL_DIRECTORY_EXISTS }}" = "true" ] && [ -n "$CALL_DIRECTORY_PROFILE_UUID" ]; then
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINContentBlocker</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINAntifakeShare</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINCallDirectory</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" "$ANTIFAKE_PROFILE_UUID" "$CALL_DIRECTORY_PROFILE_UUID" > ./build/ExportOptions.plist
              else
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINContentBlocker</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINAntifakeShare</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" "$ANTIFAKE_PROFILE_UUID" > ./build/ExportOptions.plist
              fi
            else
            # С extension (Antifake Share signed at archive via Automatic if no secret)
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n    <key>family.aladdin.ios.ALADDINContentBlocker</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" > ./build/ExportOptions.plist
            fi
          else
            # Без extension
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>family.aladdin.ios</key>\n    <string>%s</string>\n  </dict>\n  <key>uploadBitcode</key>\n  <false/>\n  <key>uploadSymbols</key>\n  <true/>\n  <key>compileBitcode</key>\n  <false/>\n</dict>\n</plist>\n' "$APPLE_TEAM_ID" "$APP_PROFILE_UUID" > ./build/ExportOptions.plist
          fi
        fi
        
        EXPORT_ARGS=(
          -exportArchive
          -archivePath ./build/ALADDIN.xcarchive
          -exportPath ./build/export
          -exportOptionsPlist ./build/ExportOptions.plist
        )
        if [ "${{ env.ANTIFAKE_SHARE_EXISTS }}" = "true" ] && [ -z "$ANTIFAKE_PROFILE_UUID" ]; then
          EXPORT_ARGS+=(-allowProvisioningUpdates)
        fi
        if [ "${{ env.CALL_DIRECTORY_EXISTS }}" = "true" ] && [ -z "${{ env.CALL_DIRECTORY_PROFILE_UUID }}" ]; then
          EXPORT_ARGS+=(-allowProvisioningUpdates)
        fi
        xcodebuild "${EXPORT_ARGS[@]}"
        
        echo "Checking exported files..."
        ls -la ./build/export/ 2>&1 || echo "Export directory not found"
        
        # Найти .ipa файл
        IPA_FILE=$(find ./build/export -name "*.ipa" | head -1)
        echo "IPA file: $IPA_FILE"
        if [ -z "$IPA_FILE" ]; then
          echo "Error: IPA file not found!"
          exit 1
        fi
        echo "IPA_FILE_PATH=$IPA_FILE" >> $GITHUB_ENV
        
    - name: Setup App Store Connect API keys
      run: |
        # Устанавливаем переменные окружения глобально для следующих шагов
        if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] && \
           [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && \
           [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
          echo "✅ App Store Connect API keys are set"
          echo "APP_STORE_CONNECT_API_KEY_SET=true" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID_SET=true" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ID_SET=true" >> $GITHUB_ENV
        else
          echo "⚠️ App Store Connect API keys not set"
          echo "IPA file will be available as artifact for manual upload"
          echo "APP_STORE_CONNECT_API_KEY_SET=false" >> $GITHUB_ENV
        fi
        
        # Проверяем, что IPA файл существует
        if [ ! -f "${{ env.IPA_FILE_PATH }}" ]; then
          echo "Error: IPA file not found at ${{ env.IPA_FILE_PATH }}"
          exit 1
        fi
        
        echo "IPA file found: ${{ env.IPA_FILE_PATH }}"
        echo "Ready to upload to App Store Connect"
        
    - name: Upload to App Store Connect using apple-actions
      if: env.APP_STORE_CONNECT_API_KEY_SET == 'true'
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ env.IPA_FILE_PATH }}
        api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always() && env.IPA_FILE_PATH != ''
      with:
        name: ALADDIN-IPA
        path: ${{ env.IPA_FILE_PATH }}
        retention-days: 30
        if-no-files-found: warn
        
    - name: Cleanup Keychain
      if: always() && env.CERTIFICATE_AVAILABLE == 'true'
      run: |
        echo "Cleaning up keychain..."
        if [ -n "${{ env.KEYCHAIN_PATH }}" ] && [ -f "${{ env.KEYCHAIN_PATH }}" ]; then
          security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
          echo "✅ Keychain cleaned up"
        fi
