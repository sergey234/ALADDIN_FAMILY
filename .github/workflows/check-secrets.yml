              if [ -z "$GREP_UUID" ]; then
                # Метод 4: sed для поиска UUID в следующей строке
                GREP_UUID=$(echo "$PLUTIL_OUTPUT" | sed -n '/<key>UUID<\/key>/,+2p' | grep '<string>' | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' | tr -d '\t ' | head -1 || echo "")
              fi
              if [ -z "$GREP_UUID" ]; then
                # Метод 5: агрессивный поиск UUID в XML (любой UUID)
                GREP_UUID=$(echo "$PLUTIL_OUTPUT" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1 || echo "")
              fi
