name: Build and Upload to App Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build Archive
        run: |
          xcodebuild -workspace ALADDIN.xcworkspace \
            -scheme ALADDIN \
            -configuration Release \
            -archivePath ./build/ALADDIN.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="iOS Team Store Provisioning Profile: family.aladdin.ios"
      
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/ALADDIN.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist exportOptions.plist
      
      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ./build/*.ipa
          api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}

