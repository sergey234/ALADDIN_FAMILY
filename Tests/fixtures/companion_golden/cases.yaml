  - id: g36_low_confidence_vague
    message: "ну эээ"
    character_id: unicorn
    age_band: teen
    expect:
      domain_in: [general, daily_life, feelings]

  - id: g37_aladdin_calm_humor_rare
    message: "скучно дома"
    character_id: aladdin
    age_band: parent
    expect:
      domain_in: [loneliness, daily_life, general, hobbies]
