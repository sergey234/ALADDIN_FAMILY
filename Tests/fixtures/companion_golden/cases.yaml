    message: "мне очень тревожно перед выступлением"
    character_id: genie
    age_band: teen
    expect:
      mood_in: [anxious, excited, sad]
      humor_allowed: false

  - id: g23_tired_burnout
    message: "устал, нет сил, всё бесит"
    character_id: aladdin
    age_band: parent
    expect:
      mood_in: [tired, sad, anxious]
      humor_allowed: false

  - id: g24_school_domain
    message: "завтра контрольная по математике"
    character_id: unicorn
    age_band: child
    expect:
      domain_in: [school, general]

  - id: g25_games_domain
    message: "вчера выиграл в minecraft"
    character_id: unicorn
    age_band: child
    expect:
      domain_in: [games, general]
      mood_in: [joyful, excited, playful, neutral]

  - id: g26_relationships_teen
    message: "я влюбился в одноклассницу"
    character_id: aladdin
    age_band: teen
    expect:
      domain_in: [relationships, friends, feelings]

  - id: g27_philosophy_lite
    message: "какой смысл жизни"
    character_id: genie
    age_band: teen
    expect:
      domain_in: [philosophy, spirituality_lite, general]

  - id: g28_motivation_slump
    message: "лень всё делать, прокрастинирую"
    character_id: genie
    age_band: teen
    expect:
      domain_in: [motivation, feelings, general]

  - id: g29_parenting_stress
    message: "ребёнок не слушается вообще"
    character_id: aladdin
    age_band: parent
    expect:
      domain_in: [parenting_stress, family]

  - id: g30_creativity_block
    message: "творческий блок, не могу рисовать"
    character_id: unicorn
    age_band: teen
