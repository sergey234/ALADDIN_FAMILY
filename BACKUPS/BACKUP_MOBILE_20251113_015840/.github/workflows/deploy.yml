name: ALADDIN Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  # MARK: - Staging Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Build for Staging
      run: |
        xcodebuild archive \
          -project ALADDIN.xcodeproj \
          -scheme ALADDIN \
          -configuration Debug \
          -archivePath ALADDIN-Staging.xcarchive \
          -destination 'generic/platform=iOS'
          
    - name: Export Staging IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath ALADDIN-Staging.xcarchive \
          -exportPath Export-Staging \
          -exportOptionsPlist ExportOptions-Staging.plist
          
    - name: Upload to Staging
      run: |
        echo "Uploading to staging environment..."
        # Здесь бы загружали в staging среду
        
  # MARK: - Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Build for Production
      run: |
        xcodebuild archive \
          -project ALADDIN.xcodeproj \
          -scheme ALADDIN \
          -configuration Release \
          -archivePath ALADDIN-Production.xcarchive \
          -destination 'generic/platform=iOS'
          
    - name: Export Production IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath ALADDIN-Production.xcarchive \
          -exportPath Export-Production \
          -exportOptionsPlist ExportOptions-Production.plist
          
    - name: Deploy to TestFlight
      run: |
        echo "Deploying to TestFlight..."
        # Здесь бы использовали fastlane для деплоя в TestFlight
        
    - name: Deploy to App Store
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "Deploying to App Store..."
